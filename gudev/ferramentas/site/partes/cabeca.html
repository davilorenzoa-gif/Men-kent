<script>document.documentElement.classList.replace('no-js','js');
/* troca de página animada: se o navegador desistir dela, a página só aparece normal, sem erro no console */
['pageswap','pagereveal'].forEach(function(t){addEventListener(t,function(e){var v=e.viewTransition;if(v&&v.ready)v.ready.catch(function(){});});});
addEventListener('unhandledrejection',function(e){var r=e.reason;if(r&&/InvalidStateError|AbortError/.test(r.name)&&/transition/i.test(r.message))e.preventDefault();});</script>
