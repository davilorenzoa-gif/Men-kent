<script>
const BT=0.47604, PH=0.388, K=k=>PH+k*BT, H=15.497, END=H+1.15;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,p)=>a+(b-a)*p, pr=(t,a,b)=>cl((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3), eOut5=p=>1-Math.pow(1-p,5), eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const spring=(p,f=2.4,z=5)=>p<=0?0:1-Math.exp(-z*p)*Math.cos(f*Math.PI*p);
function show(id,on){$(id).style.display=on?'block':'none';return on}
function S(id,tr,op,fl){const e=$(id);e.style.transform=tr||'none';if(op!==undefined)e.style.opacity=op;if(fl!==undefined)e.style.filter=fl}
function slam(id,t,t0,{from=1.5,dur=.24,blur=20}={}){const e=$(id);const p=pr(t,t0,t0+dur);if(t<t0){e.style.opacity=0;return}
  e.style.opacity=cl((t-t0)/.06);e.style.transform=`scale(${lerp(from,1,eExpo(p))})`;const b=lerp(blur,0,eOut(p));e.style.filter=b>.3?`blur(${b}px)`:''}
function pop(id,t,t0,{dur=.3,d=24}={}){const e=$(id);const p=eOut5(pr(t,t0,t0+dur));e.style.opacity=t<t0?0:cl((t-t0)/.08);e.style.transform=`translateY(${(1-p)*d}px) scale(${lerp(1.08,1,p)})`}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- palmeiras pra textura dos letreiros ----------
function palm(c,x,y,h,lean,sc,col){c.fillStyle=col;c.strokeStyle=col;const tx=x+lean,ty=y-h;c.beginPath();const n=24;
  for(let i=0;i<=n;i++){const q=i/n;c.lineTo(x+lean*q*q-(16-9*q)*sc/2,y-h*q)}for(let i=n;i>=0;i--){const q=i/n;c.lineTo(x+lean*q*q+(16-9*q)*sc/2,y-h*q)}c.fill();
  for(let f=0;f<11;f++){const a0=-Math.PI/2+(f/10-.5)*3.6,L=(95+rnd(f*3+x)*40)*sc,dr=.6+rnd(f*7+x)*.6;const pts=[];
    for(let i=0;i<=16;i++){const q=i/16;pts.push([tx+Math.cos(a0)*L*q,ty+Math.sin(a0)*L*q+dr*L*q*q*.9,q])}
    c.lineWidth=3*sc;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
    for(let i=1;i<pts.length;i++){const [px,py,q]=pts[i],[ox,oy]=pts[i-1];const dx=px-ox,dy=py-oy,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl,ll=(1-q*.75)*24*sc;
      for(const s of [-1,1]){c.lineWidth=(3.2-2*q)*sc;c.beginPath();c.moveTo(px,py);c.lineTo(px+nx*ll*s-dx/dl*ll*.55,py+ny*ll*s-dy/dl*ll*.55+ll*.35);c.stroke()}}}}
const palmTex=(function(){const c=document.createElement('canvas');c.width=800;c.height=400;const x=c.getContext('2d');
  [[110,400,250,-20,.9],[250,400,180,15,.65],[560,400,230,-15,.85],[700,400,300,25,1.0]].forEach(a=>palm(x,...a,'rgba(120,50,170,.5)'));return c.toDataURL()})();
document.documentElement.style.setProperty('--palm',`url(${palmTex})`);
function T(id,html){$(id).innerHTML=`<div class="o1">${html}</div><div class="l o2">${html}</div><div class="l f">${html}</div><div class="l f2">${html}</div>`}
T('t_m','Açaí de<br>segunda');T('t_bf','Black<br>Friday');T('t_bf2','Black Friday');T('t_bf3','Black Friday');
const PR='<span style="font-size:.4em;vertical-align:.95em;margin-right:.06em">R$</span>24<span style="font-size:.5em;vertical-align:.62em">,99</span>';T('t_pr',PR);T('t_pr2',PR);
function shineT(id,t,t0,d=.9){$(id).style.setProperty('--sh',`${lerp(130,-30,eIO(pr(t,t0,t0+d)))}%`)}

// ---------- mapa da cidade (desenhado aqui, estilizado; não é mapa de verdade) ----------
const MW=2400,MH=4000,MAP=document.createElement('canvas');MAP.width=MW;MAP.height=MH;
const ROUTE=[[620,3420],[620,2760],[1180,2760],[1180,1640],[1760,1640],[1760,980]];
const DEST=ROUTE.at(-1),START=ROUTE[0];
function buildMap(){const c=MAP.getContext('2d');c.fillStyle='#231735';c.fillRect(0,0,MW,MH);
  // quarteirões
  for(let gx=0;gx<MW;gx+=140)for(let gy=0;gy<MH;gy+=140){const j=rnd(gx*7+gy);c.fillStyle=j<.08?'#1f3a33':j<.14?'#2d2147':'#2a1d40';c.beginPath();c.roundRect(gx+14,gy+14,112,112,10);c.fill()}
  // rio
  c.strokeStyle='#1d2f63';c.lineWidth=90;c.lineCap='round';c.beginPath();c.moveTo(-100,1200);c.bezierCurveTo(700,1500,900,2300,1500,2250);c.bezierCurveTo(2000,2200,2200,2900,2600,3100);c.stroke();
  c.strokeStyle='#2a3f7a';c.lineWidth=60;c.stroke();
  // ruas
  c.strokeStyle='#3d2e58';c.lineWidth=12;for(let x=0;x<=MW;x+=140){c.beginPath();c.moveTo(x,0);c.lineTo(x,MH);c.stroke()}for(let y=0;y<=MH;y+=140){c.beginPath();c.moveTo(0,y);c.lineTo(MW,y);c.stroke()}
  // avenidas e via expressa
  c.strokeStyle='#6c5891';c.lineWidth=24;[[[620,0],[620,MH]],[[0,2760],[MW,2760]],[[1180,0],[1180,MH]],[[0,1640],[MW,1640]],[[1760,0],[1760,MH]]].forEach(([a,b])=>{c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()});
  c.strokeStyle='#9b84c4';c.lineWidth=34;c.beginPath();c.moveTo(-100,3800);c.bezierCurveTo(800,3300,1500,3600,2500,2600);c.stroke();
  c.fillStyle='rgba(255,255,255,.07)';c.font='900 190px Arc';c.textAlign='center';c.save();c.translate(1200,2150);c.rotate(-.18);c.fillText('GUARULHOS',0,0);c.restore()}
const LOGO=new Image();LOGO.src='assets/logo-pecai.png';
function routeLen(){let L=0;for(let i=1;i<ROUTE.length;i++)L+=Math.hypot(ROUTE[i][0]-ROUTE[i-1][0],ROUTE[i][1]-ROUTE[i-1][1]);return L}
const RL=routeLen();
function routeAt(p){let d=p*RL;for(let i=1;i<ROUTE.length;i++){const a=ROUTE[i-1],b=ROUTE[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){const q=d/l;return [lerp(a[0],b[0],q),lerp(a[1],b[1],q),Math.atan2(b[1]-a[1],b[0]-a[0]),i]}d-=l}const n=ROUTE.length;return [DEST[0],DEST[1],-Math.PI/2,n-1]}
// desenha o mapa com câmera (cx,cy no mapa, escala s), rota até "prog" e o jogador em "pp"
function drawMap(c,W,Hh,cx,cy,s,prog,pp,t,{pin=1,rot=0}={}){c.save();c.clearRect(0,0,W,Hh);c.translate(W/2,Hh/2);c.rotate(rot);c.scale(s,s);c.translate(-cx,-cy);
  c.drawImage(MAP,0,0);
  // rota roxa brilhando (inteira apagada + percorrida acesa)
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle='rgba(206,92,255,.35)';c.lineWidth=30;c.beginPath();ROUTE.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();
  c.shadowColor='#e06bff';c.shadowBlur=30;c.strokeStyle='#d36bff';c.lineWidth=26;c.setLineDash([]);c.beginPath();c.moveTo(...ROUTE[0]);
  const [ex,ey,,ei]=routeAt(prog);for(let i=1;i<ei;i++)c.lineTo(...ROUTE[i]);c.lineTo(ex,ey);c.stroke();c.shadowBlur=0;
  // destino: pino com a logo
  if(pin>0){const pr2=1+.08*Math.sin(t*6);for(let r=0;r<2;r++){const ph=((t*1.2+r*.5)%1);c.strokeStyle=`rgba(255,110,190,${(1-ph)*.8})`;c.lineWidth=8/s*1.2;c.beginPath();c.arc(DEST[0],DEST[1],(60+ph*160)/Math.max(.35,s)*.6,0,7);c.stroke()}
    const R=70/Math.max(.35,s)*.55*pr2*pin;c.fillStyle='#ff4f9e';c.beginPath();c.moveTo(DEST[0],DEST[1]);c.arc(DEST[0],DEST[1]-R*1.6,R*1.02,Math.PI*.78,Math.PI*.22);c.closePath();c.fill();
    c.save();c.beginPath();c.arc(DEST[0],DEST[1]-R*1.6,R*.86,0,7);c.clip();if(LOGO.complete)c.drawImage(LOGO,DEST[0]-R*.86,DEST[1]-R*1.6-R*.86,R*1.72,R*1.72);c.restore()}
  // jogador (seta branca)
  if(pp!==null){const [px,py,ang]=routeAt(pp);c.save();c.translate(px,py);c.rotate(ang+Math.PI/2);const z=34/Math.max(.35,s)*.7;c.fillStyle='#fff';c.strokeStyle='#14081f';c.lineWidth=z*.25;
    c.beginPath();c.moveTo(0,-z);c.lineTo(z*.7,z*.8);c.lineTo(0,z*.4);c.lineTo(-z*.7,z*.8);c.closePath();c.stroke();c.fill();c.restore()}
  c.restore()}

// ---------- estrelas de procurado ----------
function starPath(cx,cy,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1)}return d+'Z'}
$('stars').innerHTML=[0,1,2,3,4].map(i=>`<path id="sb${i}" d="${starPath(1000-i*78,250,32)}" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.6)" stroke-width="4"/><path id="sf${i}" d="${starPath(1000-i*78,250,32)}" fill="#fff" stroke="#14081f" stroke-width="5" opacity="0" style="filter:drop-shadow(0 0 10px rgba(255,255,255,.8))"/>`).join('');
function stars(t,n0){const on=[K(10.5),K(11),K(11.5),K(12),K(12.5)];for(let i=0;i<5;i++){const f=$('sf'+i);const ti=on[4-i];let o=t>=ti?1:0;
  if(t>=ti&&t<ti+.6)o=(Math.floor((t-ti)*12)%2)?.35:1;if(t>=K(12.5)&&t<K(14))o=(Math.floor((t-K(12.5))*6)%2)?.5:1;f.setAttribute('opacity',o*n0);
  const s=t>=ti?1+.5*Math.exp(-(t-ti)*12):1;f.setAttribute('transform',`translate(${1000-i*78},250) scale(${s}) translate(${-(1000-i*78)},-250)`)}}

// ---------- roda de itens ----------
const WC=[540,860],RO=430,RI=180,NSEG=8;
function arc(a0,a1,ro,ri){const p=(a,r)=>[(WC[0]+Math.cos(a)*r).toFixed(1),(WC[1]+Math.sin(a)*r).toFixed(1)];const [x0,y0]=p(a0,ro),[x1,y1]=p(a1,ro),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0},${y0}A${ro},${ro} 0 0 1 ${x1},${y1}L${x2},${y2}A${ri},${ri} 0 0 0 ${x3},${y3}Z`}
function lockIcon(cx,cy){return `<g opacity=".55" transform="translate(${cx},${cy})"><rect x="-26" y="-6" width="52" height="42" rx="8" fill="none" stroke="#fff" stroke-width="6"/><path d="M-15,-6 v-12 a15,15 0 0 1 30,0 v12" fill="none" stroke="#fff" stroke-width="6"/></g>`}
(function(){let h='<defs><radialGradient id="selg"><stop offset="0" stop-color="#ffd6ec"/><stop offset="1" stop-color="#ff5fae"/></radialGradient></defs>';
  for(let i=0;i<NSEG;i++){const mid=-Math.PI/2+i*2*Math.PI/NSEG,a0=mid-Math.PI/NSEG+.035,a1=mid+Math.PI/NSEG-.035;
