<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Arc";src:url(assets/Archivo.ttf);font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#140b20}canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}</style></head><body>
<canvas id="c1"></canvas><canvas id="c2"></canvas>
<script src="assets/three-0.160-bundle.js"></script><script src="assets/hdri-sunset.js"></script><script src="assets/cena3d.js"></script>
<script>
window.seek=async t=>{ const a=document.getElementById('c1'),b=document.getElementById('c2'); if(t<10){b.style.display='none';a.style.display='block';C3D.city(t)} else {a.style.display='none';b.style.display='block';C3D.pot({x:540,y:900,h:900,rotY:(t-10)*.6,tilt:.12})} };
window.ready=document.fonts.load('900 170px Arc').then(()=>C3D.init(document.getElementById('c1'),document.getElementById('c2'))).then(()=>true).catch(e=>{console.log('ERR '+e.message);return true});
</script></body></html>
