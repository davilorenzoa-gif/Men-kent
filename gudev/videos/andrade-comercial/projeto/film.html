<script>
/* Comercial Andrade Ferro e Aço · 24,6 s · 1080x1920.
   Tudo é função do tempo: seek(t) desenha o quadro do segundo t. O render tira 120 fotos/s e o ffmpeg mistura de 4 em 4 (desfoque de movimento).
   Os cortes caem na grade da música de referência: 123,3 bpm, 1º tempo em 0,07 s. */
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const BEAT=60/123.3,B0=0.07,bar=k=>B0+k*4*BEAT,bt=(k,n)=>bar(k)+n*BEAT,FIM=24.6;
const Y='#FFC61A';
// ---------- DADOS (só o que está confirmado em gudev/04-HISTORICO-CLIENTES.md) ----------
const DADOS={zap:'(11) 99804-1251',fixo:'(11) 2581-4404',insta:'@ferroeacoandrade',end:'Av. Dr. José Arthur Nova, 1.829 · Jd. Helena · São Paulo'};
// ---------- utilidades ----------
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,p)=>a+(b-a)*p,seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3),ei=p=>p*p*p,eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,eoe=p=>p>=1?1:1-Math.pow(2,-10*p),eie=p=>p<=0?0:Math.pow(2,10*p-10);
const back=p=>{const a=1.70158,b=a+1;return 1+b*Math.pow(p-1,3)+a*Math.pow(p-1,2)};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function pchip(keys){const n=keys.length,xs=keys.map(k=>k[0]),ys=keys.map(k=>k[1]),d=[],m=[];
  for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/(xs[i+1]-xs[i]);
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:2*d[i-1]*d[i]/(d[i-1]+d[i]);
  return t=>{if(t<=xs[0])return ys[0];if(t>=xs[n-1])return ys[n-1];let i=0;while(t>xs[i+1])i++;const h=xs[i+1]-xs[i],s=(t-xs[i])/h,s2=s*s,s3=s2*s;
    return (2*s3-3*s2+1)*ys[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*ys[i+1]+(s3-s2)*h*m[i+1]}}
// ---------- imagens ----------
const A={},cache=new Map();
const load=src=>{const im=new Image();im.src=src;return im.decode().then(()=>im)};
function frame(seq,i){const k=seq+'/'+String(i).padStart(4,'0')+'.jpg';let p=cache.get(k);
  if(p){cache.delete(k);cache.set(k,p)}else{p=load('seq/'+k);cache.set(k,p);if(cache.size>70)cache.delete(cache.keys().next().value)}return p}
function frameW(seq,i){const k=seq+'/'+String(i).padStart(4,'0')+'.webp';let p=cache.get(k);
  if(p){cache.delete(k);cache.set(k,p)}else{p=load('seq/'+k);cache.set(k,p);if(cache.size>70)cache.delete(cache.keys().next().value)}return p}
function font(px,wt=900,st='extra-condensed',it=false){x.font=`${it?'italic ':''}${wt} ${st} ${px}px Archivo`}
// clipe com mistura entre quadros, zoom com âncora, giro, borrão de direção (bx) e borrão de zoom (zb)
async function clip(seq,st,o={}){
  const max=o.max||354,f=clamp(st*(o.fps||60),0,max),i=Math.floor(f),fr=f-i;
  const a=await frame(seq,i),b=fr>.03&&i<max?await frame(seq,i+1):null;
  const z=o.z||1,cx=(o.cx??.5)*W,cy=(o.cy??.5)*H,taps=o.bx?9:(o.zb?7:1);
  for(let k=0;k<taps;k++){const u=taps>1?k/(taps-1)-.5:0;
    x.save();x.translate(cx+(o.dx||0)+u*(o.bx||0),cy+(o.dy||0));x.rotate(o.rot||0);const s=z*(1+u*(o.zb||0));x.scale(s,s);x.translate(-cx,-cy);
    x.globalAlpha=1/(k+1);x.drawImage(a,0,0,W,H);if(b){x.globalAlpha=fr/(k+1);x.drawImage(b,0,0,W,H)}

}
function flash(a,col='#fff'){if(a<=0)return;x.save();x.globalAlpha=clamp(a);x.fillStyle=col;x.fillRect(-60,-60,W+120,H+120);x.restore()}
function scrim(a){if(a<=0)return;const g=x.createLinearGradient(0,980,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.55,`rgba(0,0,0,${.5*a})`);g.addColorStop(1,`rgba(0,0,0,${.8*a})`);x.fillStyle=g;x.fillRect(-60,980,W+120,H)}
// faíscas determinísticas (rastro aditivo, gravidade e arrasto)
function sparks(t,T,ox,oy,n,seed,o={}){const age=t-T,L=o.life||1.4;if(age<0||age>L)return;
  x.save();x.globalCompositeOperation='lighter';x.lineCap='round';const g=o.g??1500,dr=o.drag??1.7;
  for(let i=0;i<n;i++){const a=(o.a0??0)+rnd(seed+i)*(o.spread??Math.PI*2),sp=(o.v||900)*(.3+rnd(seed+i*3+1)*.95),life=L*(.35+rnd(seed+i*7+2)*.65);if(age>life)continue;
    const pos=tt=>{const k=(1-Math.exp(-dr*tt))/dr;return [ox+Math.cos(a)*sp*k,oy+Math.sin(a)*sp*k+.5*g*tt*tt]};
    const [x1,y1]=pos(age),[x0,y0]=pos(Math.max(0,age-.04)),f=1-age/life;
    x.strokeStyle=`rgba(255,${150+95*f|0},${30+170*f*f|0},${f})`;x.lineWidth=(o.w||3.2)*(.45+rnd(seed+i*11))*f+.7;
    x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke()}
  x.restore()}
function chuva(t,T0,T1,ox,oy,seed,o={}){const dt=o.dt||.035;for(let e=Math.max(0,Math.floor((t-T0-(o.life||1))/dt));e<=Math.floor((Math.min(t,T1)-T0)/dt);e++)sparks(t,T0+e*dt,ox,oy,o.n||4,seed+e*17,o)}
function brilho(px,py,r,a,col='255,200,120'){if(a<=0)return;x.save();x.globalCompositeOperation='lighter';const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.25,`rgba(${col},${a*.6})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);x.restore()}
// letreiro do tour: etiqueta amarela + linhas grandes que batem na tela
function titulo(t,T0,T1,tag,lines,o={}){if(t<T0||t>T1)return;const out=seg(t,T1-.13,T1),al=1-out,px=o.px||176,lh=px*.9,yb=o.yb||1452,n=lines[0].ate!==undefined?1:lines.length,y=yb-(n-1)*lh,p0=(lines[0].px||px);
  scrim(al*eo(seg(t,T0,T0+.2)));
  x.save();x.translate(0,out*46);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=26;x.shadowOffsetY=6;
  const pt=eo(seg(t,T0,T0+.22));x.globalAlpha=al*pt;x.fillStyle=Y;x.fillRect(72,y-p0*.78-64,lerp(0,84,pt),8);
  font(34,700,'normal');x.letterSpacing='7px';x.fillText(tag,72,y-p0*.78-14);x.letterSpacing='0px';
  lines.forEach((L,i)=>{const s=typeof L=='string'?{s:L}:L,at=s.at??T0+.05+i*.1,p=seg(t,at,at+.26);if(p<=0||(s.ate&&t>=s.ate))return;const e=eoe(p);
    font(s.px||px,900,'extra-condensed',true);const k=Math.min(1,900/x.measureText(s.s).width)*(1+.3*(1-e));
    x.save();x.globalAlpha=al*clamp(p*5);x.translate(70-(1-e)*30,s.ate!==undefined?yb:y+i*lh);x.scale(k,k);x.fillStyle=s.c||'#fff';x.fillText(s.s,0,0);x.restore()});
  x.restore()}

// =====================================================================================
// CENA 1 · TERRA (WebGL): órbita, hiperzoom no Brasil, travessia das nuvens
// =====================================================================================
const SP={lat:-23.49*Math.PI/180,lon:-46.41*Math.PI/180};
const gc=document.createElement('canvas');gc.width=720;gc.height=1280;
const gl=gc.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});let U={};
const FS=`precision highp float;
uniform vec2 uRes;uniform float uDist,uLon,uLat,uTime,uHaze,uRoll;uniform vec3 uSun;
uniform sampler2D tDay,tNight,tCloud,tStars;
const float PI=3.14159265;
vec3 dirLL(float la,float lo){return vec3(cos(la)*sin(lo),sin(la),cos(la)*cos(lo));}
vec2 eq(vec3 n){return vec2(atan(n.x,n.z)/(2.*PI)+.5,.5-asin(clamp(n.y,-1.,1.))/PI);}
void main(){
  vec2 uv=(gl_FragCoord.xy/uRes)*2.-1.;
  float ty=tan(radians(20.)),tx=ty*uRes.x/uRes.y;vec2 q=vec2(uv.x*tx,uv.y*ty);
  float cr=cos(uRoll),sr=sin(uRoll);q=vec2(q.x*cr-q.y*sr,q.x*sr+q.y*cr);
  vec3 T=dirLL(uLat,uLon),P=T*uDist,f=-T,r=normalize(cross(f,vec3(0.,1.,0.))),u=cross(r,f);
  vec3 d=normalize(f+q.x*r+q.y*u);
  float b=dot(P,d),h=b*b-(dot(P,P)-1.);
  vec3 col=pow(texture2D(tStars,eq(d)).rgb,vec3(1.6))*.9;
  if(h>0.&&b<0.){
    vec3 n=normalize(P+d*(-b-sqrt(h)));vec2 e=eq(n);
    float nl=dot(n,uSun),day=smoothstep(-.12,.25,nl);
    vec3 dc=texture2D(tDay,e).rgb;
    float oc=smoothstep(.02,.12,dc.b-max(dc.r,dc.g)*.92);
    vec3 lit=dc*(.035+1.2*max(nl,0.));
    lit+=vec3(1.,.9,.75)*pow(max(dot(n,normalize(uSun-d)),0.),70.)*.6*oc;
    vec3 night=texture2D(tNight,e).rgb*vec3(1.,.78,.45)*1.7*(1.-day);
    float cl=texture2D(tCloud,e+vec2(uTime*.0012,0.)).r;
    col=mix(lit+night,vec3(.03+max(nl,0.)*1.08),cl*.88*mix(.3,1.,day));
    float rim=pow(1.-max(dot(n,-d),0.),3.);
    col+=vec3(.22,.5,1.)*rim*(.12+max(nl+.2,0.))*.95;
    col=mix(col,vec3(.74,.85,1.),uHaze*(.3+.7*day));
  }else{
    vec3 pc=P+d*max(-b,0.);float g=exp(-(length(pc)-1.)*26.);
    col+=vec3(.28,.55,1.)*g*(.08+max(dot(normalize(pc),uSun)+.25,0.))*.95;
  }
  gl_FragColor=vec4(pow(col,vec3(.9))*1.06,1.);
}`;
function glInit(){
  const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
  const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  for(const n of ['uRes','uDist','uLon','uLat','uTime','uHaze','uRoll','uSun','tDay','tNight','tCloud','tStars'])U[n]=gl.getUniformLocation(p,n);
  [['tDay',A.day,1],['tNight',A.night,1],['tCloud',A.cloud,1],['tStars',A.stars,0]].forEach(([n,im,mip],i)=>{const tx=gl.createTexture();gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);if(mip)gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mip?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(U[n],i)});
  gl.uniform2f(U.uRes,gc.width,gc.height);
  const sl=8*Math.PI/180,so=SP.lon-38*Math.PI/180;gl.uniform3f(U.uSun,Math.cos(sl)*Math.sin(so),Math.sin(sl),Math.cos(sl)*Math.cos(so));
}
function nuvemSprite(sd){const n=document.createElement('canvas');n.width=n.height=1024;const g=n.getContext('2d');
  for(let k=0;k<7;k++){const cx=180+rnd(sd+k)*664,cy=180+rnd(sd+k+30)*664;
    for(let i=0;i<26;i++){const a=rnd(sd+k*40+i)*6.283,r=Math.pow(rnd(sd+k*40+i+500),.8)*190,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.6,rr=34+rnd(sd+k*40+i+900)*105;
      const gr=g.createRadialGradient(px,py,0,px,py,rr);gr.addColorStop(0,'rgba(255,255,255,.36)');gr.addColorStop(.55,'rgba(246,250,255,.15)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(px-rr,py-rr,rr*2,rr*2)}}
  return n}
function terra(t){
  const o=1-eo(seg(t,0,bar(1)+.5)),p=seg(t,bar(1),bar(2)),pz=Math.pow(p,1.22);
  const alt=t<bar(1)?5.7-.9*eo(t/bar(1)):Math.exp(lerp(Math.log(4.8),Math.log(.0011),pz));
  const lon=SP.lon-o*34*Math.PI/180,lat=SP.lat+o*27*Math.PI/180,roll=.22*o+pz*pz*1.0;
  const haze=clamp((Math.log(.07)-Math.log(alt))/(Math.log(.07)-Math.log(.004)));

  for(let k=0;k<taps;k++){const s=1+zb*k/6;x.save();x.globalAlpha=1/(k+1);x.translate(W/2,H/2);x.scale(s,s);x.drawImage(gc,-W/2,-H/2,W,H);x.restore()}
  // mira em São Paulo
  const dll=(la,lo)=>[Math.cos(la)*Math.sin(lo),Math.sin(la),Math.cos(la)*Math.cos(lo)],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],nrm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)};

  const zc=dot(v,f),ty=Math.tan(20*Math.PI/180),tx=ty*W/H;let qx=dot(v,r)/zc,qy=dot(v,u)/zc;const cr=Math.cos(-roll),sr=Math.sin(-roll);[qx,qy]=[qx*cr-qy*sr,qx*sr+qy*cr];

    for(let k=0;k<4;k++){x.beginPath();x.arc(mx,my,R,rot+k*Math.PI/2+.25,rot+k*Math.PI/2+Math.PI/2-.25);x.stroke()}
    x.beginPath();x.arc(mx,my,7,0,7);x.fill();
    const pl=eo(seg(t,1.1,1.5)),lx=clamp(mx,330,750);x.globalAlpha=am*pl;x.lineWidth=3;x.beginPath();x.moveTo(mx,my-R-12);x.lineTo(mx,my-R-12-64*pl);x.stroke();x.textAlign='center';
    font(50,900,'condensed');x.fillStyle='#fff';x.letterSpacing='3px';x.fillText('SÃO PAULO · BRASIL',lx,my-R-146);
    font(27,600,'normal');x.fillStyle=Y;x.letterSpacing='5px';x.fillText('JARDIM HELENA · ZONA LESTE',lx,my-R-100);x.textAlign='left';x.letterSpacing='0px';x.restore()}
  // travessia das nuvens e clarão
  x.save();
  for(let i=0;i<7;i++){const q=(p-(.4+i*.08))/.26;if(q<=0||q>1.35)continue;const s=.5*Math.exp(q*3.4),a=clamp(q*3)*clamp((1.35-q)*2.2);
    for(let k=0;k<4;k++){x.save();x.translate(W/2+(rnd(i+9)-.5)*460,H/2+(rnd(i+19)-.5)*700);x.rotate(i*1.3+p*1.5);const sk=s*(1+k*.09);x.scale(sk,sk);x.globalAlpha=a*.2;x.drawImage(A.sombras[i%3],-750,-700,1500,1500);x.globalAlpha=a*.2;x.drawImage(A.nuvens[i%3],-750,-750,1500,1500);x.restore()}}
  x.restore();
  flash(Math.pow(seg(p,.78,.99),1.5));
}

// =====================================================================================
// TOUR · rampas de velocidade (tempo do filme -> tempo do clipe)
// =====================================================================================
const WW=bt(5,2);   // fim do relógio
const R_FACHADA=pchip([[bar(2),.25],[bar(2)+.5,1.35],[bar(2)+.95,2.35],[bar(3)+.3,3.6]]);                // caminhonete -> letreiro (clipe 58)
const R_ENTRADA=pchip([[bar(3)-.5,1.0],[bar(3),1.22],[bar(3)+.78,3.72],[bar(4),4.9],[bar(5)+.3,6.0]]);      // portão -> bancadas -> faísca em câmera lenta (clipe 59)
const R_LINHA=pchip([[WW-.4,.15],[WW,.4],[WW+.55,1.0],[bar(6),3.2],[bar(6)+.42,5.2],[bt(6,2)+.2,5.92]]);    // faixa vermelha -> pilhas de tela (clipe 60)
const R_SAIDA=pchip([[bar(9),.1],[bar(9)+.5,1.3],[bar(9)+1.5,2.2],[bar(10),2.8],[bar(10)+.45,3.3]]);          // corredor -> porta de saída (clipe 61)
const R_LETREIRO=pchip([[bar(10)+.2,3.3],[bar(10)+.75,4.3],[bar(11)-.34,5.45],[bar(11),5.95]]);              // fachada -> letreiro (clipe 58)
const W1=bar(3)-.24,WD=.44,T_SOL=bar(10)+.3;   // chicote, corte pelo sol
async function sFachada(t,o={}){const a=t-bar(2),e=eoe(clamp(a/.55));
  await clip('c58',R_FACHADA(t),{z:1.02+.55*(1-e)+.06*seg(t,bar(2)+.9,W1),zb:.3*(1-seg(a,0,.4)),cx:.5,cy:.42,rot:-.05*(1-e),...o})}
async function sEntrada(t,o={}){const a=t-bar(3),k=seg(t,bar(4),bar(5));
  const pz=1+.09*(1-eoe(clamp((t-bar(4))/.5)))*(t>=bar(4)?1:0)+.16*k;     // pancada + empurrão lento na faísca
  const mer=seg(t,bar(3)-.1,bar(3)+.75);                                 // mergulho pelo portão
  await clip('c59',R_ENTRADA(t),{z:pz*(1+.1*Math.sin(mer*Math.PI)),zb:.2*Math.sin(mer*Math.PI),rot:.035*Math.sin(mer*Math.PI*2)*(1-k),cx:lerp(.5,.6,k),cy:lerp(.5,.62,k),...o})}
async function sLinha(t,o={}){const m=seg(t,WW+.45,bar(6)+.45),k=seg(t,bt(6,1)+.2,bt(6,2));
  const z=1.04+.07*seg(t,WW,bar(6))+.08*Math.sin(m*Math.PI)+ (t>bt(6,2)-.24?1.6*eie(seg(t,bt(6,2)-.24,bt(6,2))):0);
  await clip('c60',R_LINHA(t),{z,zb:.16*Math.sin(m*Math.PI)+(t>bt(6,2)-.24?.5*seg(t,bt(6,2)-.24,bt(6,2)):0),rot:-.04*Math.sin(m*Math.PI*2),cy:.55,...o})}
async function sSaida(t,o={}){const a=t-bar(9),e=eoe(clamp(a/.5));
  if(t<T_SOL){const sol=seg(t,bar(10)-.1,T_SOL);await clip('c61',R_SAIDA(t),{z:1+.6*(1-e)+.25*eie(sol),zb:.3*(1-seg(a,0,.4))+.25*sol,...o});brilho(W/2+40,820,200+900*sol,.25+.75*sol*sol,'255,225,170');return}
  const fim=seg(t,bar(11)-.3,bar(11)),b=eoe(seg(t,T_SOL,T_SOL+.5));
  await clip('c58',R_LETREIRO(t),{z:1.25-.23*b+2.6*eie(fim),zb:.25*(1-b)+.5*fim,cx:.5,cy:lerp(.5,.35,b),rot:.02*Math.sin(seg(t,bar(10)+.6,bar(10)+1.1)*Math.PI),...o});
  flash((1-eo(seg(t,T_SOL,T_SOL+.4)))*.95,'#fff6e4')}

// =====================================================================================
