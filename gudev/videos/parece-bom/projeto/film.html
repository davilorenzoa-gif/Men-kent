<script>
// ---------- tempo: grade da música (140,35 bpm) ----------
const BT = 0.427503, G0 = 2.901;          // 1ª batida do drop abafado no filme
const K = k => G0 + k * BT;
const STOP = K(88), BRK = K(100), DROP = K(104), HIT = K(127), END = 66.6;

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo3 = p => 1 - Math.pow(1 - p, 3), ei3 = p => p * p * p, eo5 = p => 1 - Math.pow(1 - p, 5);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const spring = (dt, z = .42, w = 12) => dt <= 0 ? 0 : 1 - Math.exp(-z * w * dt) * Math.cos(w * Math.sqrt(1 - z * z) * dt);
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
function S(el, o) {
  if (typeof el == 'string') el = $(el); const s = el.style;
  if (o.x !== undefined || o.y !== undefined || o.s !== undefined || o.r !== undefined || o.sx !== undefined)
    s.transform = `translate(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px) rotate(${(o.r || 0).toFixed(3)}deg) scale(${o.sx !== undefined ? o.sx.toFixed(4) + ',' + o.sy.toFixed(4) : (o.s === undefined ? 1 : o.s).toFixed(4)})`;
  if (o.o !== undefined) s.opacity = cl(o.o).toFixed(3);
  if (o.f !== undefined) s.filter = o.f;
}
const show = (id, v) => { $(id).style.display = v ? 'block' : 'none' };
function cam(id, px, py, qx, qy, s) { $(id).style.transform = `translate(${(qx - s * px).toFixed(2)}px,${(qy - s * py).toFixed(2)}px) scale(${s.toFixed(4)})` }
const popS = (t, t0, z = .45, w = 13) => t < t0 ? 0 : spring(t - t0, z, w);
function wordIn(el, t, t0, d = .4, dy = 30, bl = 12) { const p = seg(t, t0, t0 + d), e = eo3(p); S(el, { y: (1 - e) * dy, o: e, f: `blur(${((1 - e) * bl).toFixed(2)}px)` }) }
const shake = (t, t0, a = 10) => t < t0 ? 0 : a * Math.exp(-(t - t0) * 9) * Math.sin((t - t0) * 70);

// ---------- peças ----------
const FIG = (fill = '#f4f4f4') => `<svg width="120" height="260" viewBox="0 0 120 260"><circle cx="60" cy="46" r="36" fill="${fill}"/><path d="M14 260V154a46 46 0 0 1 92 0V260Z" fill="${fill}"/></svg>`;
const GHOST = `<svg width="120" height="260" viewBox="0 0 120 260"><g class="ln" stroke-width="3.5" stroke-dasharray="9 11"><circle cx="60" cy="46" r="36"/><path d="M14 258V154a46 46 0 0 1 92 0V258"/></g></svg>`;
function add(par, html) { $(par).insertAdjacentHTML('beforeend', html) }
function fig(par, id, x, fl, cls = 'g') { add(par, `<div id="${id}" class="a ${cls}" style="left:${x - 60}px;top:${fl - 260}px;width:120px;height:260px;transform-origin:50% 100%">${FIG()}</div>`) }
function floorL(par, id, x0, x1, y) { add(par, `<div id="${id}" class="floor" style="left:${x0}px;top:${y}px;width:${x1 - x0}px"></div>`) }
function store(par, id, x, fl, opt = {}) {
  let sc = ''; for (let i = 0; i < 6; i++) sc += ` q24.33 26 48.67 0`;
  let slats = ''; for (let y = 176; y < 326; y += 13) slats += `M104 ${y}H216`;
  const door = opt.open
    ? `<rect x="100" y="162" width="120" height="166" fill="#f4f4f4" opacity=".92"/>`
    : `<g id="${id}_own" opacity="0"><circle cx="160" cy="236" r="19" fill="#f4f4f4"/><path d="M136 328V290a24 24 0 0 1 48 0V328Z" fill="#f4f4f4"/></g>
       <path id="${id}_star" d="M160 206l11 24 26 3-19 18 5 26-23-13-23 13 5-26-19-18 26-3z" fill="#f4f4f4" opacity="0"/>
       <g id="${id}_sh"><rect x="100" y="162" width="120" height="166" fill="#070707"/><path d="${slats}" class="ln" stroke-width="3" stroke="#d8d8d8"/></g>`;
  add(par, `<div id="${id}" class="a" style="left:${x - 160}px;top:${fl - 330}px;width:320px;height:330px;transform-origin:50% 100%">
    <div id="${id}_gl" class="a" style="left:-60px;top:60px;width:440px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.35),transparent);opacity:0"></div>
    <svg class="g" width="320" height="330" viewBox="0 0 320 330">
      <g class="ln" stroke-width="4"><path d="M70 40V12H250V40"/><path d="M40 40H280L306 92H14Z"/><path d="M14 92${sc}"/><path d="M30 92V330M290 92V330"/>
      <rect x="96" y="158" width="128" height="172" rx="4"/></g>${door}</svg></div>`);
}
function pill(par, id, cx, y, txt, extra = '') { add(par, `<div id="${id}" class="pill" style="left:${cx}px;top:${y}px;transform:translateX(-50%);${extra}">${txt}</div>`) }

// ===== mundo 1 (A/B) =====
floorL('w1', 'f1', -500, 1580, 1250);
fig('w1', 'c1', 330, 1250);
store('w1', 'st1', 720, 1250);
add('w1', `<div id="lab1" class="a" style="left:720px;top:1290px"><div class="pill" style="position:relative;transform:translateX(-50%)">SUA EMPRESA</div></div>`);
add('w1', `<div id="qm" class="a" style="left:280px;top:820px;width:100px;text-align:center;font:800 124px/1 'Inter Display';text-shadow:0 0 18px rgba(255,255,255,.8),0 0 50px rgba(255,255,255,.3);transform-origin:50% 90%">?</div>`);
// tiles dos sinais

// linhas do olhar (pontos)
const HEAD = [330, 1036], DOTS = [];
TX.forEach((x, i) => {

  for (let k = 1; k <= n; k++) { const p = k / (n + 1), px = lerp(HEAD[0] + 30, ex, p), py = lerp(HEAD[1] - 30, ey, p);

  DOTS.push(arr);

// ===== mundo 2 (C) =====
floorL('w2', 'f2', -500, 1580, 1250);
fig('w2', 'fr', 300, 1250); fig('w2', 'c2', 640, 1250);
add('w2', `<div id="bub" class="a" style="left:96px;top:742px;transform-origin:30% 100%">

function dust(t, a) {

    const x = (rnd(i) * 1080 + t * (6 + rnd(i + 5) * 10) * (rnd(i + 9) > .5 ? 1 : -1) + 2160) % 1080;
    const y = (rnd(i + 3) * 1920 - t * (8 + rnd(i + 7) * 14) + 3840) % 1920;
    const r = .8 + rnd(i + 11) * 2.2, tw = .5 + .5 * Math.sin(t * (1 + rnd(i + 13) * 2) + i);
    DC.fillStyle = `rgba(255,255,255,${(a * (.05 + .18 * rnd(i + 17)) * tw).toFixed(3)})`;
    DC.beginPath(); DC.arc(x, y, r, 0, 6.283); DC.fill();

  // ================= D (30,9–STOP) e G (51,6–57) =================
  const onD = (t > 30.9 && t < STOP) || (t > 51.62 && t < 57.0); show('sD', onD);
  if (onD) {
    const g = t > 51; // segunda passagem
    // câmera
    let tx = 0;
    if (!g) tx = 560 * eio(seg(t, 34.55, 35.55)) * (1 - eio(seg(t, 36.45, 37.35)));
    cam('w3', 580 - tx / 1.12, 1000, 540, 1000, 1.12);
    S('sD', { o: g ? seg(t, 51.62, 51.9) * (1 - seg(t, 56.55, 56.95)) : seg(t, 30.9, 31.15), f: 'none' });
    // degraus
    const ST = [K(67), K(68), K(69)];
    const flat = g ? ei3(seg(t, K(115) - .16, K(115))) : 0;
    STEP.forEach((_, i) => { const p = g ? 1 : popS(t, ST[i] - .06, .55, 15); S('sp' + i, { sx: 1, sy: Math.max(0, p * (1 - flat)), o: (p > 0 ? 1 : 0) * (1 - flat) }) });
    const lift = (g ? 1 - flat : popS(t, ST[2] - .06, .55, 15)) * 285;
    const bounce = g ? 14 * Math.exp(-(t - K(115)) * 10) * Math.sin(Math.max(0, t - K(115)) * 40) * (t > K(115)) : 0;
    S('st3', { y: -lift + bounce, o: 1 });
    S('lab3', { o: g ? 1 - seg(t, 52.0, 52.2) : 1 });
    // cliente
    let cx = 200, cy = 0, co = 1;
    if (!g) {
      const wk = seg(t, 34.5, 36.25); cx = lerp(200, -230, eio(wk)); cy = -Math.abs(Math.sin(wk * Math.PI * 7)) * 12 * (wk > 0 && wk < 1);
      cy += -18 * Math.sin(Math.PI * seg(t, 34.15, 34.45));   // pulinho antes de virar
      co = 1 - seg(t, 36.1, 36.3);
    } else {
      const wk = seg(t, 52.25, 54.05); cx = lerp(-160, 650, eo3(wk)); cy = -Math.abs(Math.sin(wk * Math.PI * 8)) * 12 * (wk > 0 && wk < 1);
      co = (1 - seg(t, 55.85, 56.1));
      if (t > 55.6) cx = lerp(650, 760, eio(seg(t, 55.6, 56.05)));
    }
    S('c3', { x: cx - 200, y: cy, o: co });
    // próximo
    S('cursor', { s: popS(t, 35.65, .5, 14), o: g ? 0 : seg(t, 35.65, 35.7) * (1 - seg(t, 36.3, 36.5)), y: 6 * Math.sin(t * 5) });
    const rp = seg(t, 35.86, 36.3); S('ring', { s: .3 + 1.4 * eo3(rp), o: g ? 0 : (rp > 0 && rp < 1 ? 1 - rp : 0) });
    $('stN_gl').style.opacity = g ? 0 : (seg(t, 35.86, 36.0) * .9 * (1 - .5 * seg(t, 36.4, 37))).toFixed(2);
    // você não percebe
    const gh = g ? 0 : seg(t, 37.0, 37.5); S('ghost', { o: gh * (.55 + .25 * Math.sin(t * 4)) });
    S('labG', { o: g ? 0 : seg(t, 37.55, 37.75), y: 10 * (1 - eo3(seg(t, 37.55, 37.85))) });
    const reveal = g ? 0 : seg(t, 37.3, 37.85);
    const roll = g ? eio(seg(t, 53.55, 54.1)) : 0;
    $('st3_sh').setAttribute('opacity', (1 - .78 * reveal).toFixed(3));
    $('st3_sh').setAttribute('transform', `translate(0 162) scale(1 ${(1 - roll).toFixed(4)}) translate(0 -162)`);
    $('st3_own').setAttribute('opacity', reveal.toFixed(3));
    $('st3_star').setAttribute('opacity', g ? (seg(t, 53.6, 53.9) * (1 + .0)).toFixed(3) : (reveal * .0).toFixed(3));
    $('st3_gl').style.opacity = g ? (seg(t, 53.7, 54.1) * (.75 + .15 * Math.sin(t * 6))).toFixed(2) : 0;
    const tb = g ? 0 : popS(t, 38.05, .5, 12); S('tb', { s: tb, o: seg(t, 38.05, 38.12) });
    [K(83), K(84), K(85)].forEach((tc, i) => { $('ck' + i).querySelector('svg').style.opacity = seg(t, tc, tc + .08); $('ck' + i).style.opacity = .45 + .55 * seg(t, tc, tc + .1) });
    // G: caminho laranja + volta
    const pw = g ? eio(seg(t, 54.95, 55.7)) : 0; $('path').style.width = (690 * pw).toFixed(1) + 'px'; $('path').style.opacity = (1 - seg(t, 56.5, 56.9)).toFixed(2);
    S('loop', { s: g ? popS(t, 53.95, .45, 12) : 0, r: g ? -360 * eo3(seg(t, 53.95, 54.9)) : 0, o: g ? seg(t, 53.95, 54.0) : 0, y: g ? -lift : 0 });
    if (g) sh += shake(t, K(115), 12);
    sh += shake(t, ST[0], 5) + shake(t, ST[1], 6) + shake(t, ST[2], 9);
    $('f3').style.opacity = g ? (1 - seg(t, 56.5, 56.6)).toFixed(2) : 1;
  }

  // ================= E + F (STOP–52,1) =================
  const onE = t > STOP + 0.25 && t < 52.1; show('sE', onE);
  if (onE) {
    const dr = eio(seg(t, 40.85, 41.75));
    $('phF').querySelector('rect').style.strokeDasharray = `${dr} 1`;
    S('phN', { o: seg(t, 41.5, 41.8) });
    const pre = seg(t, BRK, DROP);
    $('phGlow').style.opacity = (.25 * seg(t, 43.8, BRK) + .75 * ei3(pre) + (t > DROP ? .5 * (1 - seg(t, DROP, DROP + 1.2)) + .15 : 0)).toFixed(3);
    // estrela quebrada
    const bs = popS(t, 41.85, .5, 12);
    S('bstar', { s: bs, o: seg(t, 41.85, 41.9) * (1 - seg(t, 43.55, 43.85)) * (t > 42.4 && t < 42.7 ? (Math.sin(t * 80) > 0 ? 1 : .3) : 1) });
    // "?" em volta → puxados pra dentro do celular
    QF.forEach(([x, y], i) => {
      const t0 = 43.95 + i * .28, p = popS(t, t0, .45, 13), pull = ei3(seg(t, BRK + i * .12, DROP - .12 + i * .03));
      const ang = pull * 2.4 + i, rr = (1 - pull);
      const dx = (540 - x) * pull + Math.sin(ang * 3) * 40 * rr * pull, dy = (980 - y) * pull + Math.cos(ang * 3) * 40 * rr * pull;
      S('q' + i, { x: dx, y: dy + 8 * Math.sin(t * 2.5 + i) * (1 - pull), s: p * (1 - .85 * pull), r: 200 * pull * (i % 2 ? 1 : -1), o: seg(t, t0, t0 + .05) * (1 - seg(t, DROP - .1, DROP)) });
    });
    // site montando no drop
    SB.forEach((b, i) => {
      const t0 = DROP + i * 2 * BT - 0.02, p = t < t0 ? 0 : spring(t - t0, .5, 15), e = eo5(seg(t, t0, t0 + .32));
      const [fx, fy, fr] = SBF[i];
      S(b, { x: fx * (1 - e), y: fy * (1 - e), r: fr * (1 - e), s: lerp(.6, 1, p), o: seg(t, t0, t0 + .05) });
      sh += shake(t, t0 + .3, 7);
    });
    // celular: entra, pulsa no drop, sai pro mundo
    const kick = t > DROP ? Math.exp(-(t - DROP) * 6) : 0;
    const out = eio(seg(t, 51.62, 52.05));
    S('phW', { s: (1 + .06 * kick) * lerp(1, .3, out), o: 1 - seg(t, 51.75, 52.05), y: -12 * Math.sin(t * 1.3) * (t < DROP) + lerp(0, -180, out), x: lerp(0, 260, out) });
  }
  // flash no drop
  $('flash').style.opacity = (t >= DROP ? .95 * Math.exp(-(t - DROP) * 7) : 0) + (t >= HIT ? .55 * Math.exp(-(t - HIT) * 6) : 0);
  // palavras grandes do site
  BIGW.forEach((w, i) => { const t0 = DROP + i * 2 * BT - .02, t1 = i < 4 ? t0 + 2 * BT : 51.62; const el = $('bw' + i);
    const vis = t >= t0 && t < t1 + .2; el.style.display = vis ? 'block' : 'none';
    if (vis) { const p = popS(t, t0, .5, 16); S(el, { s: lerp(1.25, 1, p), o: seg(t, t0, t0 + .05) * (1 - seg(t, t1, t1 + .15)), f: `blur(${(6 * (1 - seg(t, t0, t0 + .12))).toFixed(1)}px)` }) } });

  // ================= G: texto =================
  const onG = t > 52.2 && t < 57.0; show('sG', onG);
  if (onG) {
    const out = eio(seg(t, 56.5, 56.9));
    S('sG', { y: -60 * out, o: 1 - out, f: `blur(${(10 * out).toFixed(1)}px)` });
    wordIn($('g1'), t, 52.3, .45, 40, 16);
    G2.forEach((w, i) => wordIn(w, t, 52.95 + i * .26, .4, 24, 10));
    const g3 = popS(t, 54.6, .5, 13); S('g3', { s: lerp(.85, 1, g3), o: seg(t, 54.6, 54.7), f: `blur(${(8 * (1 - seg(t, 54.6, 54.8))).toFixed(1)}px)` });
    G4.forEach((w, i) => wordIn(w, t, 55.1 + i * .27, .4, 24, 10));
  }

  // ================= linha → "_" do logo =================
  const onL = t >= 56.5 && t < HIT; show('line', onL);
  if (onL) {
    const p = eio(seg(t, 56.65, HIT));
    const w = lerp(1080, 98, p), x = lerp(0, 190 + 602, p), y = lerp(1250, 820 + 128, p), h = lerp(3, 25, ei3(p));
    const L = $('line').style; L.width = w.toFixed(1) + 'px'; L.height = h.toFixed(1) + 'px';
    L.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; L.background = p > .6 ? '#F0612D' : '#f4f4f4';
    L.boxShadow = p > .6 ? '0 0 16px 3px rgba(240,97,45,.85)' : '0 0 12px 2px rgba(255,255,255,.75)';
    $('line').style.opacity = 1;
  }

  // ================= H + I: logo e pergunta =================
  const onH = t >= HIT - 0.01; show('sH', onH);
  if (onH) {
    const pb = spring(t - HIT, .55, 9), up = eio(seg(t, 60.45, 61.05));
    S('logoW', { s: lerp(1.12, 1, pb) * lerp(1, .6, up), y: lerp(0, -500, up), o: 1, f: `blur(${(Math.max(0, 1 - pb) * 6).toFixed(2)}px) drop-shadow(0 0 ${(40 * (1 - seg(t, HIT, HIT + 1.2))).toFixed(1)}px rgba(255,140,90,.7))` });
    const blink = t > HIT + 1.6 && (Math.floor((t - HIT - 1.6) / 0.53) % 2 == 1);
    $('cur').style.opacity = blink ? 1 : 0;
    $('sweep').style.backgroundPosition = `${lerp(120, -120, eio(seg(t, HIT + .05, HIT + .9)))}% 0`;
    $('sweep').style.opacity = t > HIT && t < HIT + 1 ? 1 : 0;
    S('halo', { s: .9 + .1 * eo3(seg(t, HIT, HIT + 2)), o: eo3(seg(t, HIT, HIT + 1.5)) * (1 - .5 * up), y: -420 * up });
    TAG.forEach((w, i) => wordIn(w, t, 57.95 + i * .3, .45, 20, 10));
    S('tag', { o: 1 - seg(t, 60.4, 60.7), y: -30 * seg(t, 60.4, 60.7) });
    // @ embaixo do logo, depois sobe junto
    const igp = popS(t, 59.4, .5, 13);
    $('ig').style.transform = `translate(${(540).toFixed(0)}px,${lerp(1200, 486, up).toFixed(1)}px) translateX(-50%) scale(${igp.toFixed(3)})`;
    $('ig').style.opacity = seg(t, 59.4, 59.45);
    CTA.forEach((w, i) => wordIn(w, t, [60.85, 61.05, 61.25, 61.45, 61.95, 62.15, 62.4, 62.75, 63.05, 63.3][i], .45, 30, 14));
    const bx = popS(t, 63.6, .5, 12); S('box', { s: lerp(.9, 1, bx), o: seg(t, 63.6, 63.75) });
    $('caret').style.opacity = t > 63.8 && Math.floor((t - 63.8) / .5) % 2 == 0 ? 1 : 0;
    S('arr', { o: seg(t, 64.0, 64.2), y: 14 * Math.abs(Math.sin((t - 64) * 4.2)) });
  }

  // selo da série (contexto nos 3 primeiros segundos)
  { const p = popS(t, -0.2, .5, 12), o = 1 - seg(t, 3.0, 3.3); $('serie').style.display = o > 0 ? 'block' : 'none';
    $('serie').style.transform = `translate(540px,${(444 - 20 * seg(t, 3.0, 3.3)).toFixed(1)}px) translateX(-50%) scale(${p.toFixed(3)})`; $('serie').style.opacity = o; }
  // tremida geral
  $('st').style.transform = sh ? `translate(${(sh * .6).toFixed(2)}px,${sh.toFixed(2)}px)` : 'none';
}
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => { })))).then(() => { seek(0); return true });
</script></body></html>
