<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaporação na rolagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo,#DAD5E2);color:#221B33;font:400 16px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
canvas{display:block} button,input{font:inherit;color:inherit}
.nota{position:fixed;left:12px;bottom:12px;z-index:50;max-width:min(520px,calc(100% - 24px));font-size:12px;background:rgba(255,255,255,.75);border-radius:10px;padding:8px 12px}
:root{--perola-2:#E8E4EE;--berinjela-2:#4B4260;--ambar:#C2702A;--iris:#6A55D0;--bergamota:#8FAE45;--linha:rgba(34,27,51,.16);--serif:"Bodoni Moda",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
.antes,.depois{height:70vh;display:grid;place-items:center;font:400 clamp(28px,5vw,56px)/1.1 var(--serif);text-align:center;padding:0 16px}
/* ---------- WOW 2: a pele hora a hora ---------- */
.pele{position:relative;height:520vh}
.pele-palco{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:24px;
  padding:80px max(16px,calc((100vw - 1180px)/2)) 40px}
#particulas{position:absolute;inset:0;width:100%;height:100%}
.pele-info{position:relative;z-index:2}
.relogio{font:400 clamp(72px,11vw,168px)/.85 var(--serif);letter-spacing:-.04em;font-variant-numeric:lining-nums tabular-nums}
.relogio small{font-size:.32em;letter-spacing:0;margin-left:.15em;font-family:var(--sans);font-weight:600}
.fase{margin-top:18px;min-height:7.2em}
.fase b{display:block;font:600 14px/1 var(--sans);color:var(--berinjela-2);margin-bottom:10px}
.fase p{font:400 clamp(20px,2.1vw,28px)/1.25 var(--serif);max-width:22ch}
.medidores{position:relative;z-index:2;display:grid;gap:14px;align-self:start;margin-top:6vh;justify-self:end;width:min(360px,100%);
  background:rgba(232,228,238,.72);border:1px solid var(--linha);border-radius:18px;padding:18px 18px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.medidor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.medidor span{font-weight:600}
.medidor em{font-style:normal;color:var(--berinjela-2);font-variant-numeric:tabular-nums}
.medidor .trilho{grid-column:1/-1;height:6px;border-radius:9px;background:rgba(34,27,51,.08);overflow:hidden}
.medidor .trilho i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);border-radius:9px}
.aviso-pele{font-size:12px;color:var(--berinjela-2);margin-top:2px}
.linha-pele{position:absolute;left:0;right:0;bottom:9vh;height:1px;background:var(--linha);z-index:1}
.linha-pele span{position:absolute;left:max(16px,calc((100vw - 1180px)/2));top:8px;font-size:12px;font-weight:600;color:var(--berinjela-2)}
@media (max-width:820px){
  .pele-palco{grid-template-columns:minmax(0,1fr);align-content:start;padding-top:86px;gap:12px}
  .fase{min-height:6.4em}
  .medidores{justify-self:stretch;align-self:start;width:auto;margin:0;padding:14px;gap:10px}
}


</style>
</head>
<body>
<div class="antes">Role pra ver evaporar</div>
  <section class="pele" id="pele" aria-label="O perfume na pele, hora a hora">
    <div class="pele-palco">
      <canvas id="particulas" aria-hidden="true"></canvas>
      <div class="pele-info">
        <div class="relogio" id="relogio" aria-live="off">0<small>min</small></div>
        <div class="fase" id="fase"><b>Saída</b><p>Borrifou. A bergamota e a pimenta-rosa chegam primeiro, e rápido.</p></div>
      </div>
      <div class="medidores" id="medidores">
        <div class="medidor"><span>Saída</span><em id="m-topo">100%</em><div class="trilho"><i style="background:var(--bergamota)"></i></div></div>
        <div class="medidor"><span>Coração</span><em id="m-cor">0%</em><div class="trilho"><i style="background:var(--iris)"></i></div></div>
        <div class="medidor"><span>Fundo</span><em id="m-fun">0%</em><div class="trilho"><i style="background:var(--ambar)"></i></div></div>
        <p class="aviso-pele">Curvas ilustrativas. O tempo real muda com a pele, o clima e a concentração.</p>
      </div>
      <div class="linha-pele" aria-hidden="true"><span>sua pele</span></div>
    </div>
  </section>
<div class="depois">Fim do dia</div>
<p class="nota">Efeito da Névoa (24/11/2026): a rolagem é o relógio. <span id="npart">0</span> partículas.</p>
<script>
(() => {
"use strict";
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
const toque = matchMedia("(pointer: coarse)").matches;
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
/* ===== TROQUE AQUI =====
   COR: as 3 cores das famílias (no site: saída, coração, fundo). Os nomes que flutuam, as fases e as curvas
   ficam dentro do bloco (NOMES, FASES, curva). Serve pra qualquer coisa que "some em tempos diferentes":
   café esfriando, pão saindo do forno, tinta secando, maquiagem que dura. */
const COR = { saida:"#8FAE45", coracao:"#6A55D0", fundo:"#C2702A" };
/* ===================================================================
   WOW 2: o perfume abrindo na pele (rolagem = relógio)
   =================================================================== */
(() => {
  const sec = $("#pele"), cv = $("#particulas"), ctx = cv.getContext("2d");
  const rel = $("#relogio"), fase = $("#fase");
  const barras = [...sec.querySelectorAll(".trilho i")], txt = [$("#m-topo"), $("#m-cor"), $("#m-fun")];
  const FAM = [hex(COR.saida), hex(COR.coracao), hex(COR.fundo)].map(c => c.map(v => Math.round(v*255)).join(","));
  /* intensidade de cada família em t horas: sobe e evapora em ritmos diferentes */
  const curva = [
    t => Math.exp(-t / .35),
    t => (1 - Math.exp(-t / .3)) * Math.exp(-t / 3.2),
    t => (1 - Math.exp(-t / 1.4)) * Math.exp(-t / 16)
  ];
  const pico = [1, .78, .74];
  const FASES = [
    {ate:.5,  nome:"Saída",   txt:"Borrifou. A bergamota e a pimenta-rosa chegam primeiro, e rápido."},
    {ate:1.5, nome:"Saída indo embora", txt:"O cítrico já está sumindo. A íris começa a aparecer por baixo."},
    {ate:4.5, nome:"Coração", txt:"Agora é a íris e a flor de laranjeira. É o cheiro que as pessoas vão lembrar."},
    {ate:7.5, nome:"Coração e fundo", txt:"O floral baixa e a madeira sobe. O perfume fica mais perto da pele."},
    {ate:99,  nome:"Fundo",   txt:"Fim do dia. Sobram o âmbar, o cedro e o almíscar, colados em você."}
  ];
  let W=0, H=0, dpr=1, prog=0, alvo=0, faseAtual=-1, ativo=false;
  const parts = []; const MAX = toque ? 260 : 620;
  function ajusta(){ dpr = Math.min(devicePixelRatio||1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  ajusta(); let lw = innerWidth; addEventListener("resize", () => { if (innerWidth !== lw || !toque){ lw = innerWidth; ajusta(); } });

  function leRolagem(){
    const r = sec.getBoundingClientRect(), total = r.height - innerHeight;
    alvo = clamp(-r.top / total, 0, 1);
  }
  const horas = p => 10 * Math.pow(p, 1.7);
  function formata(t){
    if (t < 1) return `${Math.round(t*60)}<small>min</small>`;
    const h = Math.floor(t), m = Math.round((t-h)*60/5)*5;
    return m === 0 || m === 60 ? `${m===60?h+1:h}<small>h</small>` : `${h}<small>h</small>${String(m).padStart(2,"0")}`;
  }
  /* sprite macio por família: desenhar imagem é bem mais leve que gradiente por partícula */
  const SPR = FAM.map(c => { const k = document.createElement("canvas"); k.width = k.height = 64; const g = k.getContext("2d");
    const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,`rgba(${c},.9)`); r.addColorStop(.35,`rgba(${c},.45)`); r.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle = r; g.fillRect(0,0,64,64); return k; });
  const NOMES = [["bergamota","pimenta-rosa"],["íris","flor de laranjeira"],["âmbar","cedro","almíscar"]];
  const palavras = [];
  /* a pluma sai do "pulso": centro à direita no computador, embaixo no celular */
  const origem = () => W > 820 ? W * .6 : W * .5;
  function emite(f, n){
    for (let i=0;i<n && parts.length<MAX;i++){
      const pesada = f === 2, leve = f === 0;
      const x = origem() + (Math.random()-.5) * (W > 820 ? W*.34 : W*.8) * (pesada ? .7 : 1);
      parts.push({ f, x0:x, x, y: H*.91 + Math.random()*6,
        vy: -(pesada ? .5 + Math.random()*.5 : leve ? 1.5+Math.random()*1.3 : .9+Math.random()*.8) * (H/900) * 1.9,
        deriva: (Math.random()-.5) * .5, fase: Math.random()*6.28, amp: 10 + Math.random()*(pesada?18:40),
        r: (pesada ? 10 : leve ? 6 : 8) + Math.random()*10, vida: 0, dura: pesada ? 7 + Math.random()*5 : leve ? 4+Math.random()*2.5 : 6+Math.random()*3 });
    }
  }
  let ant = performance.now(), proxPalavra = 0;
  function laco(agora){
    if (!ativo) return;
    const dt = Math.min((agora-ant)/1000, .05); ant = agora;
    prog += (alvo - prog) * (reduz ? 1 : .12);
    const t = horas(prog);
    const I = curva.map((c,i) => clamp(c(t) / pico[i], 0, 1));
    rel.innerHTML = formata(t);
    I.forEach((v,i) => { barras[i].style.transform = `scaleX(${v.toFixed(3)})`; txt[i].textContent = Math.round(v*100) + "%"; });
    const fi = FASES.findIndex(f => t < f.ate);
    if (fi !== faseAtual){ faseAtual = fi; fase.innerHTML = `<b>${FASES[fi].nome}</b><p>${FASES[fi].txt}</p>`; }

    const taxa = reduz ? .25 : 1;
    I.forEach((v,i) => { const n = v * (toque ? 2.2 : 4.5) * taxa; emite(i, Math.floor(n) + (Math.random() < n % 1 ? 1 : 0)); });

    /* um nome de nota sobe de vez em quando, sorteado pela intensidade */
    proxPalavra -= dt;
    const soma = I[0]+I[1]+I[2];
    if (proxPalavra <= 0 && soma > .05 && palavras.length < 5){
      proxPalavra = .9 + Math.random()*.8;
      let r = Math.random()*soma, f = 0; while (f < 2 && r > I[f]) { r -= I[f]; f++; }
      const lista = NOMES[f];
      palavras.push({ f, txt: lista[Math.floor(Math.random()*lista.length)], x: origem() + (Math.random()-.5)*(W > 820 ? W*.26 : W*.5), y: H*.86, vida: 0, dura: 4.5, tam: (W > 820 ? 28 : 18) + Math.random()*10 });
    }

    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "multiply";
    for (let i = parts.length-1; i >= 0; i--){
      const p = parts[i]; p.vida += dt;
      if (p.vida > p.dura || p.y < -40){ parts.splice(i,1); continue; }
      const k = p.vida / p.dura;
      p.y += p.vy * 60 * dt; p.fase += dt * (p.f===0 ? 2.2 : 1.1); p.x0 += p.deriva * 60 * dt * k;
      p.x = p.x0 + Math.sin(p.fase) * p.amp * (k + .15);
      const a = Math.sin(Math.PI * Math.min(1, k)) * (p.f===2 ? .5 : .6);
      const r = p.r * (1 + k*2.2);
      ctx.globalAlpha = a; ctx.drawImage(SPR[p.f], p.x - r, p.y - r, r*2, r*2);
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = palavras.length-1; i >= 0; i--){
      const w = palavras[i]; w.vida += dt; if (w.vida > w.dura){ palavras.splice(i,1); continue; }
      const k = w.vida / w.dura; w.y -= (W > 820 ? 70 : 40) * dt;
      ctx.globalAlpha = Math.sin(Math.PI*k) * .95;
      ctx.font = `italic 400 ${w.tam}px "Bodoni Moda", Georgia, serif`; ctx.textAlign = "center";
      ctx.fillStyle = ["#4F6B1C","#4B37B0","#8E4A12"][w.f];
      ctx.fillText(w.txt, w.x + Math.sin(k*5 + w.x)*8, w.y);
    }
    ctx.globalAlpha = 1;
    $("#npart").textContent = parts.length;
    requestAnimationFrame(laco);
  }
  addEventListener("scroll", leRolagem, {passive:true});
  new IntersectionObserver(([en]) => { const era = ativo; ativo = en.isIntersecting; if (ativo && !era){ leRolagem(); ant = performance.now(); requestAnimationFrame(laco); } }).observe(sec);
  leRolagem();
})();
})();
</script>
</body>
</html>
