<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frasco de vidro 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo,#DAD5E2);color:#221B33;font:400 16px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
canvas{display:block} button,input{font:inherit;color:inherit}
.nota{position:fixed;left:12px;bottom:12px;z-index:50;max-width:min(520px,calc(100% - 24px));font-size:12px;background:rgba(255,255,255,.75);border-radius:10px;padding:8px 12px}
:root{--berinjela-2:#4B4260;--ease:cubic-bezier(.2,.7,.2,1)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;align-items:center;min-height:100vh;padding:24px max(16px,calc((100vw - 1100px)/2))}
.frasco-box{position:relative;aspect-ratio:4/5;border-radius:28px;background:#C4BBD5;overflow:hidden}
#frasco3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#frasco{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none}
.frasco-dica{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;font-weight:600;color:var(--berinjela-2);pointer-events:none;transition:opacity .5s}
.frasco-dica.some{opacity:0}
.painel{display:grid;gap:12px}
.painel h1{font:400 40px/1 "Bodoni Moda",Georgia,serif}
#acoes{display:flex;flex-wrap:wrap;gap:8px}
#acoes button,#sacudir{border:1px solid rgba(34,27,51,.2);background:#fff;border-radius:99px;padding:10px 16px 10px 32px;cursor:pointer;font-weight:600;position:relative}
#acoes button::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c)}
#sacudir{padding-left:16px;background:#221B33;color:#fff;justify-self:start}
#nome{border:1px solid rgba(34,27,51,.2);border-radius:12px;padding:12px 14px;background:#fff}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}.frasco-box{aspect-ratio:1/1;max-height:66vh}}
</style>
</head>
<body>
<main>
  <div class="frasco-box" id="frascoBox" role="img" aria-label="Frasco de vidro arrastável com líquido">
    <canvas id="frasco3d" aria-hidden="true"></canvas>
    <canvas id="frasco"></canvas>
    <p class="frasco-dica" id="frascoDica">Pegue o frasco e arraste</p>
  </div>
  <div class="painel">
    <h1>Frasco de vidro 3D</h1>
    <p>Arraste, arremesse, solte. Pingue uma cor e sacuda.</p>
    <div id="acoes"></div>
    <input id="nome" maxlength="18" placeholder="Nome no rótulo" autocomplete="off">
    <button id="sacudir" type="button">Sacudir</button>
    <p style="font-size:13px;color:#4B4260">Renderizando em: <b id="estado">--</b></p>
  </div>
</main>
<p class="nota">Efeito da Névoa (24/11/2026): ray tracing de vidro e líquido em WebGL2, sem biblioteca; física em JS; plano B 2D.</p>
<script>
(() => {
"use strict";
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
const toque = matchMedia("(pointer: coarse)").matches;
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
/* ===== TROQUE AQUI =====
   CONC muda a força da cor do líquido e o texto pequeno do rótulo; GOTAS são os botões de cor.
   O líquido base (cor champanhe) está em camadas.push(...) dentro do módulo.
   Geometria do vidro (frasco 3D): constantes BO, CAV, BI no shader FS3 (meia largura do corpo = 1). */
const CONC = [
  {id:"edt", nome:"Eau de toilette", faixa:"5 a 15% de óleo", forca:.55},
  {id:"edp", nome:"Eau de parfum", faixa:"15 a 20% de óleo", forca:.8},
  {id:"ext", nome:"Extrait", faixa:"20 a 40% de óleo", forca:1}
];
const GOTAS = [ {nome:"Rosa", cor:"#D0577A"}, {nome:"Violeta", cor:"#6A55D0"}, {nome:"Âmbar", cor:"#C2702A"} ];
/* ===================================================================
   WOW 3: monte o seu frasco
   Física: o frasco é um corpo com massa (mola + amortecimento) que segue o dedo,
   guarda a inércia ao soltar e volta com elástico. O líquido sente a aceleração
   do frasco: a superfície é um pêndulo (modo de balanço) + 48 colunas de onda.
   Tudo desenhado no referencial do frasco: tampa, gargalo, corpo e rótulo são uma peça só.
   =================================================================== */
const Frasco = (() => {
  const box = $("#frascoBox"), cv = $("#frasco"), ctx = cv.getContext("2d"), dica = $("#frascoDica");
  const off = document.createElement("canvas"), oc = off.getContext("2d");     /* o frasco (usado 2x: frasco e reflexo) */
  const fundoC = document.createElement("canvas"), fc = fundoC.getContext("2d"); /* estúdio, pintado 1x por tamanho */
  const fadeC = document.createElement("canvas"), dc = fadeC.getContext("2d");   /* chão por cima do reflexo */
  const escolha = [null, null, null]; let conc = CONC[1], nome = "";
  let W = 0, H = 0, dpr = 1, S = 1, chao = 0;
  const B = {}, R = {x:0, y:0};
  let pExt, pInt, pParede, pBase;

  /* ---------- geometria (referencial do frasco, origem no centro do corpo) ---------- */
  function caixa(p, x, y, w, h, rt, rb){
    p.moveTo(x + rt, y); p.lineTo(x + w - rt, y); p.arcTo(x + w, y, x + w, y + rt, rt);
    p.lineTo(x + w, y + h - rb); p.arcTo(x + w, y + h, x + w - rb, y + h, rb);
    p.lineTo(x + rb, y + h); p.arcTo(x, y + h, x, y + h - rb, rb);
    p.lineTo(x, y + rt); p.arcTo(x, y, x + rt, y, rt); p.closePath();
  }
  function geo(){
    S = Math.min(W / 300, H / 390);
    Object.assign(B, { bw:204*S, bh:184*S, rt:30*S, rb:40*S, parede:9*S, teto:10*S, base:24*S,
      gw:30*S, gh:8*S, aw:42*S, ah:9*S, tw:68*S, th:52*S });
    B.ix0 = -B.bw/2 + B.parede; B.ix1 = B.bw/2 - B.parede; B.iy0 = -B.bh/2 + B.teto; B.iy1 = B.bh/2 - B.base;
    chao = H * .83; R.x = W / 2; R.y = chao - B.bh / 2;
    pExt = new Path2D(); caixa(pExt, -B.bw/2, -B.bh/2, B.bw, B.bh, B.rt, B.rb);
    pInt = new Path2D(); caixa(pInt, B.ix0, B.iy0, B.ix1 - B.ix0, B.iy1 - B.iy0, B.rt - B.parede*.8, B.rb - B.parede*1.4);
    pParede = new Path2D(); pParede.addPath(pExt); pParede.addPath(pInt);
    pBase = new Path2D(); pBase.rect(-B.bw/2, B.iy1 - 1, B.bw, B.bh/2 - B.iy1 + 1);
    grudadas.length = 0;
    for (let i = 0; i < 16; i++){ const u = .06 + Math.random()*.88, v = .3 + Math.random()*.66, r = (.8 + Math.random()*1.9) * S;
      grudadas.push({ u, v, r, f: Math.random()*6, b3: [-.86 + 1.72*u, .78 - 1.42*v, (Math.random() < .5 ? -1 : 1)*(.262 - r/(B.bw/2)), r/(B.bw/2)] }); }
  }
  function pintaFundo(){
    for (const c of [off, fundoC, fadeC]){ c.width = W*dpr; c.height = H*dpr; }
    fc.setTransform(dpr,0,0,dpr,0,0);
    let g = fc.createLinearGradient(0, 0, 0, chao);
    g.addColorStop(0, "#CBC3DA"); g.addColorStop(1, "#B9AECD");
    fc.fillStyle = g; fc.fillRect(0, 0, W, chao);
    /* feixes de luz diagonais (luz de estúdio vindo do alto à esquerda) */
    fc.save(); fc.beginPath(); fc.rect(0, 0, W, chao); fc.clip();
    [[-.15,.16,.22],[.18,.1,.16],[.42,.2,.2],[.78,.08,.12]].forEach(([x, w, a]) => {
      const x0 = W*x, lw = W*w, d = chao*.75;
      const gg = fc.createLinearGradient(x0, 0, x0 + lw, 0);
      gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(.5, `rgba(255,255,255,${a})`); gg.addColorStop(1, "rgba(255,255,255,0)");
      fc.fillStyle = gg; fc.beginPath(); fc.moveTo(x0, 0); fc.lineTo(x0 + lw, 0); fc.lineTo(x0 + lw + d, chao); fc.lineTo(x0 + d, chao); fc.fill();
    });
    fc.restore();
    g = fc.createLinearGradient(0, chao, 0, H);
    g.addColorStop(0, "#DCD5E6"); g.addColorStop(.25, "#CFC6DC"); g.addColorStop(1, "#BCB1CE");
    fc.fillStyle = g; fc.fillRect(0, chao, W, H - chao);
    g = fc.createLinearGradient(0, chao - 2, 0, chao + 3);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
    fc.fillStyle = g; fc.fillRect(0, chao - 2, W, 5);
    /* o chão some o reflexo aos poucos: cópia do chão com alfa crescente */
    dc.setTransform(1,0,0,1,0,0); dc.clearRect(0,0,fadeC.width,fadeC.height); dc.drawImage(fundoC, 0, 0);
    dc.globalCompositeOperation = "destination-in";
    g = dc.createLinearGradient(0, chao*dpr, 0, (chao + B.bh*.6)*dpr);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,1)");
    dc.fillStyle = g; dc.fillRect(0, chao*dpr, fadeC.width, fadeC.height);
    dc.globalCompositeOperation = "source-over";
  }

  /* ---------- estado ---------- */
  const F = { x:0, y:0, vx:0, vy:0, a:0, va:0, ax:0, ay:0, aa:0, yaw:.34, vyaw:0, ayaw:0, toque:0 };     /* frasco (yaw = giro no eixo vertical, mostra a lateral) */
  const N = 48, onda = new Float32Array(N), vOnda = new Float32Array(N); /* altura de cada coluna (px/S, pra cima) */
  const Lq = { phi:0, vphi:0, axAnt:0 };                               /* ângulo da superfície no mundo */
  /* camadas: 0 saída, 1 coração, 2 fundo, 3 a base (álcool de perfumaria, já no frasco) */
  const camadas = [0,0,0].map(() => ({vol:0, alvo:0, cor:[.85,.83,.88]}));
  camadas.push({vol:.46, alvo:.46, cor:hex("#EFE2C2")});
  let tampa = 0, mistura = 0, pega = null, ativo = false, t = 0;
  const gotas = [], bolhas = [], grudadas = [];

  function ajusta(){
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; geo(); pintaFundo();
    if (typeof R3 !== "undefined" && R3){ R3.tamanho(W, H); rotulo3(); }
    if (!pega){ F.x = R.x; F.y = R.y; F.vx = F.vy = 0; }
  }

  /* ---------- toque e arraste ---------- */
  const ponto = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function local(x, y){ const dx = x - F.x, dy = y - F.y, c = Math.cos(-F.a), s = Math.sin(-F.a); return { x: dx*c - dy*s, y: dx*s + dy*c }; }
  function acerta(p){ const l = local(p.x, p.y); return Math.abs(l.x) < B.bw/2 + 6*S && l.y < B.bh/2 + 6*S && l.y > -(B.bh/2 + B.gh + B.ah + B.th) && (l.y > -B.bh/2 || Math.abs(l.x) < B.tw/2 + 6*S); }
  /* no celular: tocar no frasco não rola a página; tocar fora rola normal */
  cv.addEventListener("touchstart", e => { const r = cv.getBoundingClientRect(), tq = e.touches[0];
    if (acerta({x: tq.clientX - r.left, y: tq.clientY - r.top})) e.preventDefault(); }, {passive:false});
  cv.addEventListener("pointerdown", e => {
    const p = ponto(e); if (!acerta(p)) return;
    const l = local(p.x, p.y);
    pega = { id: e.pointerId, lx: l.x, ly: l.y, x: p.x, y: p.y, hist: [{x:p.x, y:p.y, t:performance.now()}] };
    cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; dica.classList.add("some");
    /* resposta ao toque: o frasco desgruda do chão, o líquido treme e o vidro acende de leve */
    F.vy -= 140*S; F.toque = 1; for (let i = 18; i < 30; i++) vOnda[i] += Math.sin((i - 18)/11*Math.PI) * .9;
  });
  cv.addEventListener("pointermove", e => {
    const p = ponto(e);
    if (!pega){ if (!toque) cv.style.cursor = acerta(p) ? "grab" : "default"; return; }
    if (e.pointerId !== pega.id) return;
    pega.x = p.x; pega.y = p.y; const agora = performance.now();
    pega.hist.push({x:p.x, y:p.y, t:agora}); while (pega.hist.length > 2 && agora - pega.hist[0].t > 90) pega.hist.shift();
  });
  function larga(e){
    if (!pega || (e && e.pointerId !== pega.id)) return;
    const h = pega.hist, a = h[0], b = h[h.length-1], dtp = Math.max(16, b.t - a.t) / 1000;
    const lim = 2600 * S, vx = clamp((b.x - a.x)/dtp, -lim, lim), vy = clamp((b.y - a.y)/dtp, -lim, lim);
    if (performance.now() - b.t < 80){ F.vx = F.vx*.4 + vx*.6; F.vy = F.vy*.4 + vy*.6; }  /* arremesso */
    pega = null; cv.style.cursor = toque ? "" : "grab";
  }
  cv.addEventListener("pointerup", larga); cv.addEventListener("pointercancel", larga);
  cv.addEventListener("lostpointercapture", () => larga());

  function sacode(){
    if (pega) return;
    const f = (reduz ? 220 : 520) * S; let k = 0;
    const id = setInterval(() => { F.vx += (k % 2 ? -2 : 2) * f * (k ? 1 : .5); F.va += (k % 2 ? -1 : 1) * (reduz ? .8 : 2.2);
      if (++k > 5){ clearInterval(id); F.vx -= Math.sign(F.vx) * f * .5; } }, 120);
    mistura = clamp(mistura + .25, 0, 1);
  }

  /* ---------- física, passo fixo de 1/120 s ---------- */
  const PERFIL = Array.from({length:8}, (_, j) => Math.exp(-j*j/14) * .45);
  const PASSO = 1/120, G = () => 3300 * S;
  function passo(dt){
    const vx0 = F.vx, vy0 = F.vy, va0 = F.va;
    let tx = R.x, ty = R.y, k = 70, z = .34, alvoA = 0;
    if (pega){
      /* o ponto pego fica embaixo do dedo: centro = dedo − rotação(ponto pego) */
      const c = Math.cos(F.a), s = Math.sin(F.a);
      tx = pega.x - (pega.lx*c - pega.ly*s); ty = pega.y - (pega.lx*s + pega.ly*c);
      /* passou da caixa: o frasco resiste (elástico), não sai da tela */
      const solto = d => Math.min(10*S, Math.sqrt(d*S)*1.6);
      const borracha = (v, a, b) => v < a ? a - solto(a - v) : v > b ? b + solto(v - b) : v;
      tx = borracha(tx, B.bw*.5 + 14*S, W - B.bw*.5 - 14*S); ty = borracha(ty, B.bh/2 + B.gh + B.ah + B.th + 8*S, R.y);
      k = 520; z = .82;
      /* inclinação vem do braço: pegou em cima, o fundo fica pra trás; pegou embaixo, o topo fica */
      const braco = clamp(-pega.ly / (B.bh/2), -1.2, 1.6);
      alvoA = clamp((F.vx / S) * .00075 * (.35 + braco), -.55, .55);
    } else alvoA = clamp((F.vx / S) * .00018, -.25, .25);
    const c = 2 * z * Math.sqrt(k);
    F.vx += (k*(tx - F.x) - c*F.vx) * dt; F.vy += (k*(ty - F.y) - c*F.vy) * dt;
    F.x += F.vx * dt; F.y += F.vy * dt;
    /* paredes macias da caixa */
    const lado = (B.bw/2)*Math.cos(F.a) + (B.bh/2)*Math.abs(Math.sin(F.a)) + 4*S;
    const minX = lado, maxX = W - lado, minY = B.bh/2 + B.gh + B.ah + B.th + 6*S;
    if (F.x < minX){ F.x = minX; if (F.vx < 0) F.vx *= -.3; }
    if (F.x > maxX){ F.x = maxX; if (F.vx > 0) F.vx *= -.3; }
    if (F.y < minY){ F.y = minY; if (F.vy < 0) F.vy *= -.3; }
    /* rotação: mola própria; leve com o frasco solto pra balançar antes de parar */
    const ka = pega ? 160 : 85, ca = 2 * (pega ? .75 : .2) * Math.sqrt(ka);
    F.va += (ka*(alvoA - F.a) - ca*F.va) * dt;
    if (Math.abs(F.a) > .6) F.va -= Math.sign(F.a) * (Math.abs(F.a) - .6) * 900 * dt;
    F.a += F.va * dt;
    /* giro no eixo vertical: arrastar de lado vira o frasco e mostra a espessura; solto, volta balançando */
    const yaw0 = .34 + (reduz || pega ? 0 : Math.sin(t*.45)*.1);
    const alvoY = pega ? yaw0 + clamp((F.vx / S) * .0011, -.85, .85) : yaw0;
    const ky = pega ? 60 : 38, cyw = 2 * (pega ? .7 : .24) * Math.sqrt(ky), vy0w = F.vyaw;
    F.vyaw += (ky*(alvoY - F.yaw) - cyw*F.vyaw) * dt; F.yaw += F.vyaw * dt;
    F.ayaw += ((F.vyaw - vy0w)/dt - F.ayaw) * .3;
    F.toque = Math.max(0, F.toque - dt*2.2);
    /* chão: o ponto mais baixo do frasco girado não atravessa */
    const desce = (B.bh/2)*Math.cos(F.a) + (B.bw/2)*Math.abs(Math.sin(F.a));
    if (F.y + desce > chao){ F.y = chao - desce; if (F.vy > 0) F.vy *= -.25; }

    /* aceleração medida (é ela que mexe o líquido) */
    F.ax += ((F.vx - vx0)/dt - F.ax) * .3; F.ay += ((F.vy - vy0)/dt - F.ay) * .3;
    F.aa += ((F.va - va0)/dt - F.aa) * .3;

    /* modo de balanço: a superfície procura ficar perpendicular à gravidade efetiva (g − a) */
    const gy = Math.max(G()*.25, G() - F.ay);
    const phiEq = clamp(Math.atan(F.ax / gy), -.42, .42);
    const w0 = 2*Math.PI*1.35, zl = reduz ? .4 : .1;
    Lq.vphi += (-w0*w0*(Lq.phi - phiEq) - 2*zl*w0*Lq.vphi + .2*F.aa) * dt;
    Lq.phi += Lq.vphi * dt;
    if (Math.abs(Lq.phi) > .5){ Lq.phi = Math.sign(Lq.phi)*.5; Lq.vphi *= -.3; }  /* nunca vira de lado */

    /* ondas: a variação da aceleração no eixo do frasco empurra as paredes */
    const axl = F.ax*Math.cos(F.a) + F.ay*Math.sin(F.a), d = axl - Lq.axAnt; Lq.axAnt = axl;
    const imp = clamp(d / S * .0005 + F.ayaw * .004, -1.2, 1.2) * (reduz ? .4 : 1);
    for (let j = 0; j < 8; j++){ const w = PERFIL[j]; vOnda[j] += imp*w; vOnda[N-1-j] -= imp*w; }
    const amort = reduz ? .975 : .9905;
    for (let i = 0; i < N; i++){
      const l = onda[i ? i-1 : 1], r = onda[i < N-1 ? i+1 : N-2];
      vOnda[i] = (vOnda[i] + .26*(l + r - 2*onda[i])) * amort;
      vOnda[i] += .09*(l + r - 2*onda[i]) * (reduz ? 1.5 : 1);  /* tira o serrilhado: crista arredondada */
    }
    let m = 0; for (let i = 0; i < N; i++){ onda[i] = clamp(onda[i] + vOnda[i], -9, 9); m += onda[i]; }
    m /= N; for (let i = 0; i < N; i++) onda[i] -= m;   /* volume conservado */

    const energia = Math.abs(Lq.vphi) + Math.abs(imp)*.3;
    mistura = clamp(mistura + energia * dt * .045 - dt * .01, 0, 1);
    if (!reduz && Math.random() < energia * dt * 5) bolha(B.ix0 + Math.random()*(B.ix1 - B.ix0), B.iy1 - Math.random()*8*S);
  }
  function bolha(x, y){ if (bolhas.length < 26) bolhas.push({ x, y, z: (Math.random() - .5)*.42, r: (.9 + Math.random()*2.2)*S, f: Math.random()*6, vida: 0 }); }

  /* ---------- superfície ---------- */
  const xs = new Float32Array(N), ys = new Float32Array(N);
  function superficie(nivel, inc){
    const x0 = B.ix0 - 6*S, span = (B.ix1 - B.ix0) + 12*S;
    for (let i = 0; i < N; i++){
      const x = x0 + span * i/(N-1);
      const rip = reduz ? 0 : (Math.sin(x/S*.11 + t*3.1) * .45 + Math.sin(x/S*.27 - t*2.2) * .25) * S;
      xs[i] = x; ys[i] = nivel + x*inc - onda[i]*S*.9 + rip;
    }
  }
  function yEm(x){ const x0 = xs[0], span = xs[N-1] - x0, f = clamp((x - x0)/span, 0, 1) * (N-1), i = Math.min(N-2, Math.floor(f)), k = f - i; return ys[i]*(1-k) + ys[i+1]*k; }

  /* ---------- frasco em 3D de verdade: ray tracing analítico em WebGL2, sem biblioteca ----------
     Cada pixel lança um raio: entra no vidro (Fresnel + refração), atravessa a parede grossa,
     entra na cavidade, cruza a superfície do líquido (com as ondas da física), sai do outro lado

  const FS3 = `#version 300 es

uniform vec2 uRes, uC; uniform float uF; uniform vec3 uCam, uPos; uniform mat3 uRot;

  float dir = smoothstep(.74,.82,d.x)*smoothstep(.5,.32,abs(d.y - .05));
  float topo = smoothstep(.84,.92,d.y)*smoothstep(.55,.35,abs(d.x + .1));
