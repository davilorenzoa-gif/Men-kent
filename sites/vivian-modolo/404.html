@keyframes torto{0%{transform:rotate(0)}100%{transform:rotate(var(--r))}}
h1{font-family:"Instrument Serif",serif;font-weight:400;color:var(--azul);font-size:clamp(40px,9vw,72px);line-height:1;margin-bottom:14px;text-wrap:balance}
p{color:var(--suave);max-width:36ch;margin:0 auto}
.acoes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;font-weight:600;text-decoration:none}
.z{background:var(--agua);color:#fff}.l{box-shadow:inset 0 0 0 1.5px var(--azul);color:var(--azul)}
