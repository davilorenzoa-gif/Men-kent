.lnk{color:inherit;font-weight:500;min-height:44px;display:inline-flex;align-items:center;text-underline-offset:6px}
figure{position:relative;max-width:380px;justify-self:end;width:100%}
figure img{width:100%;height:auto;border-radius:6px;display:block}
figcaption{position:absolute;left:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#fff;opacity:.8}
@media (max-width:760px){.miolo{grid-template-columns:minmax(0,1fr)}figure{justify-self:start;max-width:300px}.btn{width:100%;justify-content:center}}
