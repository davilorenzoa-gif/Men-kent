.v{background:var(--vermelho);color:#fff}.l{border:1px solid rgba(244,244,244,.28);color:var(--gelo)}

#ag{transform-origin:150px 150px;animation:cai 1.6s cubic-bezier(.2,.7,.1,1) both}
