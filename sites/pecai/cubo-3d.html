*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(80% 60% at 50% 45%,#2a0b33 0%,#120612 70%,#07030a 100%);color:#e9d8ef;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden}
.palco{position:relative;width:min(100vw,640px);height:min(100svh,640px);display:grid;place-items:center;
  perspective:calc(var(--s) * 3.2);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.palco:active{cursor:grabbing}
.cubo{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;will-change:transform}
.cubo.dentro{position:absolute;inset:25%;width:50%;height:50%}
.face{position:absolute;inset:0;
  background:var(--textura) center / contain no-repeat, rgba(53,19,52,.42);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 0 calc(var(--s) * .12) rgba(224,112,211,.35),0 0 calc(var(--s) * .05) rgba(168,75,196,.25);
  backface-visibility:visible;opacity:.88}
.dentro .face{background:var(--textura) center / contain no-repeat, rgba(53,19,52,.7);opacity:1;border-color:rgba(156,201,74,.45)}
/* as 6 faces: metade do lado pra frente, cada uma girada pro seu lado */
.f1{transform:rotateY(0deg)   translateZ(calc(var(--meio)))}
.f2{transform:rotateY(90deg)  translateZ(calc(var(--meio)))}
.f3{transform:rotateY(180deg) translateZ(calc(var(--meio)))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--meio)))}
.f5{transform:rotateX(90deg)  translateZ(calc(var(--meio)))}
.f6{transform:rotateX(-90deg) translateZ(calc(var(--meio)))}
.fora{--meio:calc(var(--s) / 2)}
.dentro{--meio:calc(var(--s) / 4)}
.dica{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;font-size:14px;opacity:.75;transition:opacity .6s}
.dica.some{opacity:0}
@media (prefers-reduced-motion:reduce){.dica{transition:none}}
</style>
</head>
<body>
<div class="palco" id="palco" role="img" aria-label="Cubo 3D com a logo da Péçaí em todas as faces. Role o mouse ou deslize o dedo sobre ele pra girar.">
  <div class="cubo fora" id="cubo">
    <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
    <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    <div class="cubo dentro" id="dentro">
      <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
      <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    </div>
  </div>
</div>
<p class="dica" id="dica">Role ou deslize sobre o cubo</p>

<script>
(function(){
  'use strict';
  var palco = document.getElementById('palco'), cubo = document.getElementById('cubo'), dentro = document.getElementById('dentro'), dica = document.getElementById('dica');
  var reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Física: o gesto vira velocidade angular; a cada quadro a rotação anda e o atrito freia.
     rot += vel;  vel *= ATRITO  (0,95 = gira um tempo e para macio) */
  var rot = { x: -18, y: 28 }, vel = { x: 0, y: 0 };
  var ATRITO = reduz ? 0.82 : 0.95, FORCA_RODA = 0.02, FORCA_DEDO = 0.32, MAX = 28;
  var rodando = false, mexeu = false;

  function aplica(){
    cubo.style.transform = 'rotateX(' + rot.x.toFixed(2) + 'deg) rotateY(' + rot.y.toFixed(2) + 'deg)';
    /* o cubo de dentro gira um pouco "atrasado" e ao contrário: dá profundidade */
    dentro.style.transform = 'rotateX(' + (-rot.x * 0.6).toFixed(2) + 'deg) rotateY(' + (-rot.y * 0.6).toFixed(2) + 'deg)';
  }
  function limita(v){ return Math.max(-MAX, Math.min(MAX, v)); }
  function quadro(){
    rot.x += vel.x; rot.y += vel.y;
    vel.x *= ATRITO; vel.y *= ATRITO;
    aplica();
    if (Math.abs(vel.x) + Math.abs(vel.y) > 0.01) requestAnimationFrame(quadro);
    else rodando = false;                       // parou: o cubo fica estático, sem gastar bateria
  }
  function empurra(dx, dy){
    vel.y = limita(vel.y + dx); vel.x = limita(vel.x + dy);
    if (!mexeu){ mexeu = true; dica.classList.add('some'); }
    if (!rodando){ rodando = true; requestAnimationFrame(quadro); }
  }

  /* roda do mouse / trackpad: só em cima do cubo (a página não rola enquanto isso) */
  palco.addEventListener('wheel', function(e){
    e.preventDefault();
    var k = e.deltaMode === 1 ? 16 : 1;          // modo "linhas" (Firefox) vira pixels
    empurra(e.deltaX * k * FORCA_RODA, -e.deltaY * k * FORCA_RODA);
  }, { passive: false });

  /* toque (e arrastar com o mouse): a direção e a força do dedo viram o giro */
  var ult = null;
  palco.addEventListener('pointerdown', function(e){ ult = { x: e.clientX, y: e.clientY }; palco.setPointerCapture(e.pointerId); vel.x = vel.y = 0; });
  palco.addEventListener('pointermove', function(e){
    if (!ult) return;
    var dx = e.clientX - ult.x, dy = e.clientY - ult.y; ult = { x: e.clientX, y: e.clientY };
    empurra(dx * FORCA_DEDO, -dy * FORCA_DEDO);
  });
  function solta(){ ult = null; }
  palco.addEventListener('pointerup', solta); palco.addEventListener('pointercancel', solta);
  /* garantia pra navegador antigo sem pointer events: touchmove */
  if (!window.PointerEvent) {
    var t0 = null;
    palco.addEventListener('touchstart', function(e){ t0 = e.touches[0]; }, { passive: true });
    palco.addEventListener('touchmove', function(e){
      e.preventDefault(); var t = e.touches[0];
      empurra((t.clientX - t0.clientX) * FORCA_DEDO, -(t.clientY - t0.clientY) * FORCA_DEDO); t0 = t;
    }, { passive: false });
  }
  aplica();
})();
</script>
</body>
</html>
