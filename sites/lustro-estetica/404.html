<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Lustro</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--grafite:#15181B;--led:#F4F7F9;--nevoa:#8B949B;--ambar:#F2A33A;--tinta:#15181B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--grafite);color:var(--led);font:400 1rem/1.55 "Instrument Sans",system-ui,sans-serif;
  padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
main{max-width:34rem}
i{display:block;width:4px;height:64px;border-radius:2px;background:var(--led);box-shadow:0 0 14px 3px rgba(244,247,249,.6);margin-bottom:28px}
h1{font:900 clamp(3rem,12vw,5.5rem)/.86 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;margin:0}
p{color:var(--nevoa);margin:18px 0 28px}
.acoes{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;min-height:50px;padding:0 1.4em;border-radius:999px;font-weight:600;text-decoration:none;color:var(--led);border:1px solid rgba(244,247,249,.3)}
a.ambar{background:var(--ambar);color:var(--tinta);border-color:var(--ambar)}
a:focus-visible{outline:2px solid var(--ambar);outline-offset:3px}
</style>
</head>
<body>
<main>
  <i aria-hidden="true"></i>
  <h1>Essa página saiu da garagem.</h1>
  <p>O link pode estar errado ou a página mudou de lugar. Volte pro início ou chame a gente no WhatsApp.</p>
  <div class="acoes">
    <a class="ambar" href="/">Voltar pro início</a>
    <a href="https://wa.me/5511964650141?text=Oi!%20Vim%20pelo%20site%20da%20Lustro%20e%20quero%20agendar%20uma%20lavagem." target="_blank" rel="noopener">Chamar no WhatsApp</a>
  </div>
</main>
</body>
</html>
