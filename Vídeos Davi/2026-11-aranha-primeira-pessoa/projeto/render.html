<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Render: teia em primeira pessoa</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #palco{position:relative}
  #palco canvas{position:absolute;left:0;top:0;display:block}
</style>
</head>
<body>
<div id="palco"><canvas id="gl"></canvas><canvas id="o2"></canvas></div>
<script>
/* Renderizador quadro a quadro: pôr do sol em Nova York, primeira pessoa, WebGL puro.
   window.quadro(t) desenha o instante t (s) e devolve o JPEG em base64. Parâmetros: ?w=1280&h=720 */
(async function () {
  'use strict';
  var q = new URLSearchParams(location.search), W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
  var palco = document.getElementById('palco'), cv = document.getElementById('gl'), c2 = document.getElementById('o2');
  palco.style.width = W + 'px'; palco.style.height = H + 'px';
  [cv, c2].forEach(function (c) { c.width = W; c.height = H; c.style.width = W + 'px'; c.style.height = H + 'px'; });
  var o2 = c2.getContext('2d');
  var cena = await (await fetch('cena.json')).json(), cam = await (await fetch('caminho.json')).json();
  var gl = cv.getContext('webgl', { antialias: true, preserveDrawingBuffer: true, alpha: false });
  if (!gl.getExtension('OES_element_index_uint')) throw new Error('sem índice de 32 bits');
  var SOL = norm([.37, .156, -.916]);
  var SM = 2048, RAIO_SOMBRA = 520;

  function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cruz(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function pto(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function mult(a, b) { var o = new Float32Array(16); for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) { var s = 0; for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
  function olhar(e, alvo, up) {
    var z = norm([e[0] - alvo[0], e[1] - alvo[1], e[2] - alvo[2]]), x = norm(cruz(up, z)), y = cruz(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -pto(x, e), -pto(y, e), -pto(z, e), 1];
  }
  function orto(r, n, f) { return [1 / r, 0, 0, 0, 0, 1 / r, 0, 0, 0, 0, -2 / (f - n), 0, 0, 0, -(f + n) / (f - n), 1]; }

  // ---------- GLSL em comum: céu, nuvens, névoa, sombra, tom ----------
  var COMUM = [
    'precision highp float;',
    'uniform vec3 uSol; uniform vec3 uCam; uniform float uT;',
    'float h1(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float ruido(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(h1(i), h1(i + vec2(1,0)), f.x), mix(h1(i + vec2(0,1)), h1(i + vec2(1,1)), f.x), f.y); }',
    'float fbm(vec2 p){ float s = 0.0, a = .5; for (int i = 0; i < 5; i++){ s += a * ruido(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; } return s; }',
    'vec3 ceu(vec3 d){',
    '  float y = d.y, sd = max(dot(d, uSol), 0.0);',
    '  vec3 zen = vec3(.13,.25,.52), meio = vec3(.42,.5,.62), hor = vec3(1.0,.62,.36);',
    '  vec3 c = mix(hor, meio, smoothstep(-.02, .2, y)); c = mix(c, zen, smoothstep(.15, .7, y));',
    '  c += vec3(1.0,.48,.2) * pow(sd, 5.0) * .55 + vec3(1.0,.75,.45) * pow(sd, 40.0) * 1.2;',
    '  c = mix(c, vec3(.62,.42,.32), smoothstep(.0, -.2, y));',
    '  return c; }',
    'vec3 nuvens(vec3 d, vec3 c){',
    '  if (d.y < .012) return c;',
    '  vec2 uv = d.xz / (d.y + .05) * .8 + vec2(uT * .012, 0.0);',
    '  float n = fbm(uv * vec2(.5, 1.7)); float a = smoothstep(.5, .78, n) * smoothstep(.012, .1, d.y) * (1.0 - smoothstep(.45, .85, d.y));',
    '  float sd = max(dot(d, uSol), 0.0);',
    '  vec3 cn = mix(vec3(.55,.42,.5), vec3(1.0,.7,.42), pow(sd, 2.5)) + vec3(1.0,.58,.28) * pow(sd, 16.0) * .9;',
    '  return mix(c, cn, a * .8); }',
    'vec3 skyline(vec3 R, vec3 c, float sh){',
    '  float az = atan(R.x, -R.z);',
    '  float alt = .05 + .2 * pow(ruido(vec2(az * 9.0, 3.1)), 1.6) + .12 * step(.78, ruido(vec2(az * 31.0, 7.7)));',
    '  if (R.y > alt) return c;',
    '  float jx = fract(az * 260.0), jy = fract(R.y * 140.0);',
    '  float jan = step(.3, jx) * step(jx, .75) * step(.25, jy) * step(jy, .7);',
    '  vec3 p = mix(vec3(.1,.1,.12), vec3(.26,.2,.17), ruido(vec2(az * 9.0, 1.0)));',
    '  p += vec3(.5,.3,.16) * max(dot(normalize(vec3(-R.x, 0.0, -R.z)), uSol), 0.0) * .5 * sh;',
    '  p = mix(p, ceu(vec3(R.x, .02, R.z)) * .45, jan * .55);',
    '  return mix(p, c, smoothstep(alt - .004, alt, R.y)); }',
    'vec3 sol(vec3 d){ float sd = dot(d, uSol); return vec3(1.0,.9,.72) * (smoothstep(.99955, .99975, sd) * 8.0 + pow(max(sd, 0.0), 800.0) * 3.0); }',
    'vec3 nevoa(vec3 col, vec3 P){',
    '  vec3 d = P - uCam; float dist = length(d); vec3 dir = d / dist;',
    '  float hgt = exp(-max(min(P.y, uCam.y), 0.0) / 150.0);',
    '  float f = 1.0 - exp(-dist * .00105 * (.5 + 1.4 * hgt));',
    '  vec3 fc = ceu(normalize(vec3(dir.x, clamp(dir.y, -.02, .05), dir.z))) * .86;',
    '  return mix(col, fc, clamp(f, 0.0, 1.0)); }',
    'vec3 tom(vec3 c){ c = max(c, 0.0); c = (c * (2.51 * c + .03)) / (c * (2.43 * c + .59) + .14); return clamp(c, 0.0, 1.0); }'
  ].join('\n');
  var SOMBRA = [
    'uniform sampler2D uSombra; uniform mat4 uLPV; uniform float uTexel;',
    'float desempacota(vec4 c){ return dot(c, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0)); }',
    'float luzSol(vec3 P, vec3 N){',
    '  vec4 lp = uLPV * vec4(P + N * .45, 1.0); vec3 c = lp.xyz / lp.w * .5 + .5;',
    '  if (c.x < .001 || c.x > .999 || c.y < .001 || c.y > .999 || c.z > 1.0) return 1.0;',
    '  float s = 0.0;',
    '  for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) s += step(c.z - .00025, desempacota(texture2D(uSombra, c.xy + vec2(float(i), float(j)) * uTexel)));',
    '  return s / 9.0; }'
  ].join('\n');

  function prog(vs, fs) {
    var p = gl.createProgram();
    [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) + '\n' + s[1].slice(0, 200));
      gl.attachShader(p, sh);
    });
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  function locs(p, nomes) { var o = {}; nomes.forEach(function (n) { o[n] = n.charAt(0) === 'a' ? gl.getAttribLocation(p, n) : gl.getUniformLocation(p, n); }); return o; }

  // ---------- programas ----------
  var pCeu = prog('attribute vec2 aQ; varying vec2 vU; void main(){ vU = aQ; gl_Position = vec4(aQ, 0.0, 1.0); }',
    COMUM + '\nvarying vec2 vU; uniform vec3 uR, uU, uF; uniform float uTx, uTy;' +
    'void main(){ vec3 d = normalize(uF + vU.x * uTx * uR + vU.y * uTy * uU);' +
    ' vec3 c = nuvens(d, ceu(d)) + sol(d); gl_FragColor = vec4(tom(c), 1.0); }');
  var Uc = locs(pCeu, ['aQ', 'uR', 'uU', 'uF', 'uTx', 'uTy', 'uSol', 'uCam', 'uT']);

  var pProf = prog('attribute vec3 aP; uniform mat4 uLPV; void main(){ gl_Position = uLPV * vec4(aP, 1.0); }',
    'precision highp float; void main(){ vec4 e = vec4(1.0, 255.0, 65025.0, 16581375.0) * gl_FragCoord.z; e = fract(e); e -= e.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0); gl_FragColor = e; }');
  var Uprof = locs(pProf, ['aP', 'uLPV']);

  var pPred = prog('attribute vec3 aP; attribute vec3 aN; attribute vec4 aM; uniform mat4 uPV; varying vec3 vP; varying vec3 vN; varying vec4 vM;' +
    'void main(){ vP = aP; vN = aN; vM = aM; gl_Position = uPV * vec4(aP, 1.0); }',
    COMUM + '\n' + SOMBRA + '\nvarying vec3 vP; varying vec3 vN; varying vec4 vM;' +
    'void main(){' +
    ' vec3 N = normalize(vN), P = vP, V = normalize(P - uCam); float dist = length(P - uCam);' +
    ' float tipo = floor(vM.x + .5), s = floor(vM.y * 997.0 + .5) / 997.0;' +
    ' vec3 sunC = vec3(1.0,.7,.43) * 3.0;' +
    ' float ndl = max(dot(N, uSol), 0.0); float sh = ndl > 0.0 ? luzSol(P, N) : 0.0; float luz = ndl * sh;' +
    ' float canion = mix(.5, 1.0, smoothstep(0.0, 150.0, P.y));' +
    ' vec3 amb = mix(vec3(.3,.36,.5), vec3(.42,.47,.58), N.y * .5 + .5) * .42 * canion;' +
    ' amb += vec3(.32,.2,.12) * .12 * (1.0 - smoothstep(20.0, 120.0, P.y));' +   // luz rebatida, quente, embaixo
    ' vec3 col;' +
    ' if (tipo < -.5) {' +                                       // chão
    '  float ax = abs(P.x), zc = mod(P.z, 80.0); bool cruza = zc < 18.0;' +
    '  vec3 alb = vec3(.2,.19,.19);' +
    '  if (ax < 11.0) { alb = vec3(.11,.11,.12) + ruido(P.xz * 1.3) * .03;' +
    '   alb += vec3(.5,.48,.42) * step(abs(abs(P.x) - 3.3), .07) * step(.45, fract(P.z / 9.0)) * .7;' +
    '   alb += vec3(.6,.5,.12) * step(ax, .14) * .8;' +
    '   if (cruza && (zc < 3.0 || zc > 15.0)) alb += vec3(.55) * step(.5, fract(P.x / 1.2)) * .6; }' +
    '  else if (!cruza) alb = vec3(.38,.36,.34);' +
    '  col = alb * (amb * .9 + sunC * luz);' +
    ' } else if (N.y > .5) {' +                                  // telhados
    '  vec3 alb = mix(vec3(.3,.29,.28), vec3(.46,.42,.37), s) * (.8 + .25 * ruido(P.xz * .4) + .12 * ruido(P.xz * 6.0));' +
    '  if (tipo == 3.0) alb = vec3(.25,.17,.12);' +
    '  col = alb * (amb * 2.2 + sunC * luz * 1.3);' +
    ' } else {' +
    '  vec2 uv = abs(N.x) > .5 ? vec2(P.z, P.y) : vec2(P.x, P.y);' +
    '  float ao = mix(.5, 1.0, smoothstep(0.0, 28.0, P.y - vM.z * 0.0));' +
    '  float lod = smoothstep(150.0, 700.0, dist);' +
    '  if (tipo == 1.0) {' +                                      // vidro espelhado
    '   vec2 cel = vec2(1.5, 3.7); vec2 id = floor(uv / cel), f = fract(uv / cel);' +
    '   float mul = step(.045, f.x) * step(f.x, .955) * step(.035, f.y) * step(f.y, .965);' +
    '   vec3 Np = normalize(N + (vec3(h1(id), h1(id + 7.1), h1(id + 3.3)) - .5) * .035);' +
    '   vec3 R = reflect(V, Np);' +
    '   vec3 refl = nuvens(R, ceu(R)) + sol(R) * 1.3 * sh;' +
    '   refl = skyline(R, refl, sh);' +                           // o vidro reflete a silhueta dos outros prédios
    '   float fres = .12 + .88 * pow(1.0 - max(dot(-V, Np), 0.0), 4.0);' +
    '   vec3 tint = mix(vec3(.03,.07,.1), vec3(.06,.09,.1), s);' +
    '   vec3 vidro = mix(tint * (amb * 2.0 + sunC * luz * .2), refl * mix(vec3(.7,.86,.95), vec3(.95,.92,.85), s), clamp(fres + .35, 0.0, 1.0));' +
    '   vec3 caix = vec3(.2,.2,.21) * (amb + sunC * luz);' +
    '   col = mix(caix, vidro, mix(mul, .92, lod));' +
    '  } else if (tipo == 3.0) {' +                               // madeira da caixa d'água
    '   float tab = .8 + .2 * step(.12, fract((P.x + P.z) * 2.2)); float aro = step(.88, fract((P.y - vM.z) * 1.1));' +
    '   vec3 alb = mix(vec3(.36,.24,.16), vec3(.48,.34,.22), s) * tab; alb = mix(alb, vec3(.12,.12,.13), aro);' +
    '   col = alb * (amb * 1.2 + sunC * luz);' +
    '  } else if (tipo == 4.0) {' +                               // concreto/pedra lisa (mureta, cornija)
    '   vec3 alb = mix(vec3(.55,.52,.48), vec3(.68,.64,.58), s) * (.9 + .15 * ruido(uv * 1.5));' +
    '   col = alb * (amb * ao + sunC * luz);' +
    '  } else {' +                                                // pedra (0) ou tijolo (2) com janelas
    '   vec3 alb = tipo > 1.5 ? mix(vec3(.38,.17,.12), vec3(.52,.28,.19), s) : mix(vec3(.58,.54,.47), vec3(.76,.71,.62), s);' +
    '   alb *= .9 + .2 * ruido(uv * vec2(.6, 2.0));' +
    '   vec2 cel = vec2(2.4 + s * 1.4, 3.3 + fract(s * 7.3) * .6); vec2 id = floor(uv / cel), f = fract(uv / cel);' +
    '   float lw = .2 + fract(s * 13.7) * .14; float par = step(.5, fract(s * 5.1));' +
    '   float jx = par > .5 ? abs(fract(uv.x / (cel.x * 2.0)) - .5) * 2.0 : f.x;' +
    '   float jan = par > .5 ? step(.08, jx) * step(jx, .5) * step(.2, f.y) * step(f.y, .8) : step(lw, f.x) * step(f.x, 1.0 - lw) * step(.2, f.y) * step(f.y, .8);' +
    '   float sombraJan = jan * (step(f.y, .3) * 0.0 + step(.7, f.y));' +
    '   vec3 parede = alb * (amb * ao + sunC * luz);' +
    '   vec3 R = reflect(V, N);' +
    '   vec3 vid = mix(vec3(.025,.03,.04), ceu(R) * .8, .25 + .5 * pow(1.0 - max(dot(-V, N), 0.0), 3.0)) + sol(R) * .4 * sh;' +
    '   vid += vec3(1.0,.66,.36) * step(.92, h1(id + s * 31.0)) * .35;' +
    '   vid *= 1.0 - .55 * sombraJan;' +                         // o recuo da janela faz sombra
    '   float pil = step(.86, fract(uv.x / (cel.x * (3.0 + floor(fract(s * 3.7) * 3.0)))));' +
    '   jan *= 1.0 - pil;' +
    '   parede *= 1.0 - .1 * pil + .06 * step(.5, fract(floor(uv.y / cel.y) * .5));' +
    '   col = mix(parede, vid, mix(jan, .32, lod));' +
    '   col *= 1.0 - .16 * step(.955, fract(P.y / 3.5));' +
    '  }' +
    '  col *= ao;' +
    ' }' +
    ' col = nevoa(col, P);' +
    ' gl_FragColor = vec4(tom(col), 1.0); }');
  var Up = locs(pPred, ['aP', 'aN', 'aM', 'uPV', 'uSol', 'uCam', 'uT', 'uSombra', 'uLPV', 'uTexel']);

  var pCar = prog('attribute vec3 aP; attribute vec3 aN; attribute vec4 aC; attribute vec3 aCor; uniform mat4 uPV; uniform float uT, uZ0, uZL; varying vec3 vP; varying vec3 vN; varying vec3 vCor; varying float vLoc;' +
    'void main(){ vec3 p = aP; float z = aC.y + aC.z * uT; z = uZ0 - mod(uZ0 - z, uZL); p.z += z; p.x += aC.x; vP = p; vN = aN; vCor = aCor; vLoc = aP.y / max(aC.w, .1); gl_Position = uPV * vec4(p, 1.0); }',
    COMUM + '\n' + SOMBRA + '\nvarying vec3 vP; varying vec3 vN; varying vec3 vCor; varying float vLoc;' +
    'void main(){ vec3 sunC = vec3(1.0,.7,.43) * 3.0, amb = vec3(.35,.4,.52) * .4;' +
    ' float luz = max(dot(vN, uSol), 0.0) * luzSol(vP, vN);' +
    ' vec3 col = vCor * (amb + sunC * luz);' +
    ' if (vLoc > .64 && vN.y < .5) col = mix(col, vec3(.04,.05,.07) + vec3(.3,.25,.2) * luz, .8);' +
    ' col = nevoa(col, vP); gl_FragColor = vec4(tom(col), 1.0); }');
  var Ucar = locs(pCar, ['aP', 'aN', 'aC', 'aCor', 'uPV', 'uSol', 'uCam', 'uT', 'uZ0', 'uZL', 'uSombra', 'uLPV', 'uTexel']);

  // ---------- geometria ----------
  var vtx = [], idx = [], nv = 0;
  function face(qd, n, m) { for (var j = 0; j < 4; j++) vtx.push(qd[j][0], qd[j][1], qd[j][2], n[0], n[1], n[2], m[0], m[1], m[2], m[3]); idx.push(nv, nv + 1, nv + 2, nv, nv + 2, nv + 3); nv += 4; }
  cena.predios.forEach(function (b) {
    var x0 = b.x0, x1 = b.x1, z0 = b.z0, z1 = b.z1, y0 = b.y0, y1 = b.y1, m = [b.tipo, b.s, y0, y1];
    face([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1], m);
    face([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], [0, 0, -1], m);
    face([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], [1, 0, 0], m);
    face([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], [-1, 0, 0], m);
    face([[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], [0, 1, 0], m);
  });
  cena.prismas.forEach(function (p) {   // caixa d'água: 8 lados + tampa cônica
    var n = 8, m = [p.tipo, p.s, p.y0, p.y1];
    for (var k = 0; k < n; k++) {
      var a0 = k / n * 6.2832, a1 = (k + 1) / n * 6.2832, am = (a0 + a1) / 2;
      var x0 = p.cx + Math.cos(a0) * p.r, z0 = p.cz + Math.sin(a0) * p.r, x1 = p.cx + Math.cos(a1) * p.r, z1 = p.cz + Math.sin(a1) * p.r;
      face([[x0, p.y0, z0], [x1, p.y0, z1], [x1, p.y1, z1], [x0, p.y1, z0]], [Math.cos(am), 0, Math.sin(am)], m);
      var tp = p.y1 + p.r * .55;   // telhadinho
      face([[x0, p.y1, z0], [x1, p.y1, z1], [p.cx, tp, p.cz], [p.cx, tp, p.cz]], norm([Math.cos(am), .9, Math.sin(am)]), [3, p.s, p.y0, p.y1]);
    }
  });
  face([[-2600, 0, 900], [2600, 0, 900], [2600, 0, -3600], [-2600, 0, -3600]], [0, 1, 0], [-1, 0, 0, 0]);
  var bPred = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bPred); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vtx), gl.STATIC_DRAW);
  var bIdx = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bIdx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
  var nIdx = idx.length;
  var CORES = { taxi: [.95, .68, .06], preto: [.03, .03, .035], branco: [.78, .78, .78], cinza: [.32, .33, .35], prata: [.55, .57, .6], azul: [.08, .15, .35], vermelho: [.5, .05, .05] };
  var cvb = [], ci = [], nc = 0;
  function caixa(x0, x1, y0, y1, z0, z1, C, cor) {
