const T={c1:0, hit1:3.00, c2:4.18, hit2:7.76, c3:8.94, hit3:12.52, c4:13.70, cheio4:14.30, hit4:17.28, fim:18.44, c5:19.04, c6:27.96, c7:32.72, hit7:37.38, DUR:38.4};
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3), eOut5=k=>1-Math.pow(1-k,5), eIn=k=>k*k*k, eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

}
