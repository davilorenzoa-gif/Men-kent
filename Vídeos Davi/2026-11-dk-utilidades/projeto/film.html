<div class="cena" id="c4">
  <div class="cam" id="cam4">

    <div class="estatua-box" id="est">
      <img src="orig/876_estatua.jpg">

        <div class="card" style="left:36px;top:250px"></div><div class="card" style="left:192px;top:250px"></div>
        <div class="card" style="left:36px;top:426px"></div><div class="card" style="left:192px;top:426px"></div>
        <div class="card" style="left:36px;top:602px"></div><div class="card" style="left:192px;top:602px"></div>

      </div>
      <svg id="aura" viewBox="0 0 736 736">
        <defs><filter id="glw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
        <circle id="auG" cx="448" cy="232" r="140" fill="none" stroke="#ffd96a" stroke-width="9" filter="url(#glw)" stroke-linecap="round" transform="rotate(-90 448 232)"/>
        <circle id="auL" cx="448" cy="232" r="140" fill="none" stroke="#fff1bd" stroke-width="2.6" stroke-linecap="round" transform="rotate(-90 448 232)"/>
        <circle id="auP" r="9" fill="#fff8dc" filter="url(#glw)"/><circle id="auP2" r="3.4" fill="#fff"/>
      </svg>

<div class="clarao" id="breu" style="opacity:0;background:#0D0E11"></div>
<svg class="grao" width="1160" height="2000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<script>
/* ========= tempos (seguem a música de referência, ~100,9 bpm) ========= */
const T={c1:0, hit1:3.00, c2:4.18, hit2:7.76, c3:8.94, hit3:12.52, c4:13.70, cheio4:14.30, hit4:17.28, fim:18.44, DUR:19.0};
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3), eOut5=k=>1-Math.pow(1-k,5), eIn=k=>k*k*k, eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const eExpo=k=>k>=1?1:1-Math.pow(2,-10*k);
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
/* pancada: tremida curta que morre rápido */
function tremor(t,t0,forca=14,dur=.45){const k=t-t0;if(k<0||k>dur)return[0,0];const d=Math.pow(1-k/dur,2)*forca;return[Math.sin(k*71)*d,Math.cos(k*93)*d*.8]}

/* ========= letras ========= */
document.querySelectorAll('.txt .l').forEach(l=>{const s=l.textContent;l.textContent='';[...s].forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch===' '?' ':ch;l.appendChild(c)})});
function letras(id,t,inicios,passo=.045,dur=.55){
  const ls=$(id).querySelectorAll('.l');
  ls.forEach((l,i)=>{[...l.children].forEach((c,j)=>{
    const k=pr(t,inicios[i]+j*passo,inicios[i]+j*passo+dur), e=eBack(k);
    c.style.opacity=cl(k*2.4);
    c.style.transform=`translate3d(0,${(1-e)*86}px,0) scale(${lerp(1.5,1,eOut(k))}) rotateX(${(1-eOut(k))*70}deg)`;
    c.style.filter=k<1?`blur(${(1-eOut(k))*14}px)`:'';
  })});
}
function varredura(id,t,t0,dur=.7){const k=pr(t,t0,t0+dur);$(id).style.opacity=(k>0&&k<1)?1:0;$(id).style.backgroundPosition=`${lerp(130,-30,eIO(k))}% 0`}

/* ========= sequências de imagens ========= */
const cache={};
function quadro(pasta,n){const key=pasta+n;if(cache[key])return cache[key];
  const im=new Image();const p=new Promise(r=>{im.onload=()=>r(im);im.onerror=()=>r(null)});im.src=`assets/${pasta}/${String(n).padStart(4,'0')}.webp`;
  cache[key]=p;const ks=Object.keys(cache);if(ks.length>60)delete cache[ks[0]];return p}
async function pinta(cv,pasta,n){const im=await quadro(pasta,n);if(!im)return;const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height)}

/* ========= poeira ========= */
function poeira(cv,t,seed,n,cor,opts={}){
  const c=cv.getContext('2d'),r=rnd(seed);c.clearRect(0,0,1080,1920);c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const z=r(),x0=r()*1080,y0=r()*1920,ph=r()*6.28,sp=.25+r()*.75,tw=r()*6.28;
    const size=(opts.min||1.2)+z*z*(opts.max||9);
    const x=(x0+Math.sin(t*.35*sp+ph)*46*z+t*14*z*(opts.vx||1)+1080)%1080;
    const y=(y0-t*(10+26*z)*sp*(opts.vy||1)+19200)%1920;
    const a=(.16+.5*z)*(.55+.45*Math.sin(t*1.6*sp+tw))*(opts.a||1);
    const g=c.createRadialGradient(x,y,0,x,y,size);
    g.addColorStop(0,`rgba(${cor},${a})`);g.addColorStop(z>.75?.55:.28,`rgba(${cor},${a*(z>.75?.6:.3)})`);g.addColorStop(1,`rgba(${cor},0)`);
    c.fillStyle=g;c.beginPath();c.arc(x,y,size,0,6.283);c.fill();
  }
}
/* estrelas (cena 2) */
(function(){const c=$('estrelas').getContext('2d'),r=rnd(42);for(let i=0;i<240;i++){const x=r()*1080,y=r()*1920,s=r()*1.6+.3;c.fillStyle=`rgba(${205+r()*50|0},${215+r()*40|0},255,${.2+r()*.6})`;c.beginPath();c.arc(x,y,s,0,6.283);c.fill()}})();

/* ========= órbitas (cena 2) ========= */
const ORB=[{rx:520,ry:150,rot:-24,v:.55,f:0},{rx:470,ry:112,rot:18,v:-.42,f:2.1},{rx:600,ry:205,rot:-6,v:.3,f:4}];
function orbitas(t,ap){
  const cx=540,cy=800;let tr='',fr='';
  ORB.forEach((o,i)=>{
    const k=eOut(pr(ap,i*.14,i*.14+.75)),per=Math.PI*2*Math.sqrt((o.rx*o.rx+o.ry*o.ry)/2),dash=per/2;
    const comum=`cx="${cx}" cy="${cy}" rx="${o.rx}" ry="${o.ry}" fill="none" stroke="rgba(226,190,79,${.85*k})" stroke-width="${i==2?1.6:2.6}" transform="rotate(${o.rot} ${cx} ${cy})"`;
    // metade de trás (em cima) e metade da frente (embaixo)
    tr+=`<ellipse ${comum} stroke-dasharray="${dash*k} ${per}" stroke-dashoffset="${dash}" opacity=".55"/>`;
    fr+=`<ellipse ${comum} stroke-dasharray="${dash*k} ${per}" stroke-dashoffset="0"/>`;
    const a=t*o.v*2.2+o.f,ca=Math.cos(o.rot*Math.PI/180),sa=Math.sin(o.rot*Math.PI/180);
    const ex=o.rx*Math.cos(a),ey=o.ry*Math.sin(a),px=cx+ex*ca-ey*sa,py=cy+ex*sa+ey*ca;
    const dot=`<circle cx="${px}" cy="${py}" r="${13*k}" fill="rgba(255,226,140,.35)"/><circle cx="${px}" cy="${py}" r="${5.5*k}" fill="#fff3c8"/>`;
    if(Math.sin(a)>0)fr+=dot;else tr+=dot;
  });
  $('orbT').innerHTML=tr;$('orbF').innerHTML=fr;
}

/* ========= tela do celular da estátua (troca de tela) ========= */
/* cantos da tela na foto (736 px): sup-esq, sup-dir, inf-dir, inf-esq */
const QUAD=[[39,267],[250,175],[428,577],[247,642]];
function matrizQuad(w,h,q,esc){
  const [x0,y0]=q[0].map(v=>v*esc),[x1,y1]=q[1].map(v=>v*esc),[x2,y2]=q[2].map(v=>v*esc),[x3,y3]=q[3].map(v=>v*esc);
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1;
  const g=(dx3*dy2-dx2*dy3)/den,hh=(dx1*dy3-dx3*dy1)/den;
  const a=x1-x0+g*x1,b=x3-x0+hh*x3,c=x0,d=y1-y0+g*y1,e=y3-y0+hh*y3,f=y0;
  return `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${hh/h},0,0,1,0,${c},${f},0,1)`;
}
$('tela').style.transform=matrizQuad(360,780,QUAD,1180/736);

const CENAS=[['c1',T.c1,T.c2,cena1],['c2',T.c2,T.c3,cena2],['c3',T.c3,T.c4,cena3],['c4',T.c4,99,cena4]];
async function seek(t){
  let p=null;
  for(const [id,a,b,fn] of CENAS){const on=t>=a&&t<b;$(id).style.visibility=on?'visible':'hidden';if(on)p=fn(t)}
  // clarões nos cortes
  const cl1=Math.max(Math.exp(-Math.max(0,t-T.c2)*7)*(t>=T.c2?.16:0), Math.exp(-Math.max(0,t-T.c3)*6)*(t>=T.c3?.16:0),
                    eIn(pr(t,13.25,T.c4))*(t<T.c4?1:0), Math.exp(-Math.max(0,t-T.c4)*3.2)*(t>=T.c4?1:0));
  $('clarao').style.opacity=cl1;
  $('breu').style.opacity=Math.max(eIn(pr(t,8.55,T.c3))*(t<T.c3?1:0), 0);
  await p;
}
window.seek=seek;
