<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Inglês Neon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: palco de game show em tela única — HUD em pílulas no topo, painel neon da pergunta no centro, 4 botões-pílula embaixo. Visual escuro de propósito (tema único). */
:root {
  color-scheme: dark;
  --night: #0a0b33;
  --violet: #3b0f8f;
  --magenta: #ff3fb4;
  --cyan: #3fd8ff;
  --gold-1: #fff4a8;
  --gold-2: #ffc928;
  --gold-3: #e07a10;
  --gold-deep: #7a2c08;
  --panel: #0d1145;
  --panel-edge: #47c8ff;
  --ink: #ffffff;
  --ink-soft: #c9c8f5;
  --ink-dim: #8f8dc9;
  --good: #3ee07f;
  --bad: #ff4b5c;

  --o1: #ffa23a; --o2: #ff5c00; --o3: #ffd59a;
  --t1: #3be3c3; --t2: #0b9c9a; --t3: #b6fff0;
  --p1: #c06bff; --p2: #6e22e6; --p3: #e7c8ff;
  --r1: #ff5a6c; --r2: #cf0f2c; --r3: #ffc2c9;

  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;

  --radius-pill: 999px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  overflow-x: hidden;
}

/* ---------- Palco: fundo, holofotes, decoração ---------- */
.stage-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 45% at 50% 48%, rgba(120, 60, 255, .55), transparent 70%),
    radial-gradient(ellipse 40% 30% at 15% 70%, rgba(255, 63, 180, .28), transparent 70%),
    radial-gradient(ellipse 40% 30% at 85% 65%, rgba(63, 216, 255, .22), transparent 70%),
    linear-gradient(180deg, #0b0c3a 0%, var(--violet) 55%, #120a4a 100%);
}
.beams { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.beam {
  position: absolute; top: -10%; width: 22vmax; height: 120vmax;
  transform-origin: 50% 0;
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
  clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
  filter: blur(2px);
  mix-blend-mode: screen;
  animation: sweep 9s ease-in-out infinite alternate;
}
.beam.b1 { left: 2%;  transform: rotate(-28deg); background: linear-gradient(180deg, rgba(120,190,255,.30), transparent 70%); }
.beam.b2 { left: 22%; transform: rotate(-12deg); animation-delay: -3s; background: linear-gradient(180deg, rgba(255,120,220,.24), transparent 70%); }
.beam.b3 { right: 22%; transform: rotate(12deg); animation-delay: -5s; background: linear-gradient(180deg, rgba(200,140,255,.26), transparent 70%); }
.beam.b4 { right: 2%; transform: rotate(28deg); animation-delay: -1s; background: linear-gradient(180deg, rgba(120,230,255,.28), transparent 70%); }
@keyframes sweep { from { rotate: -6deg; } to { rotate: 6deg; } }

.streaks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.streaks i {
  position: absolute; height: 3px; width: 46vw; border-radius: 3px;
  filter: blur(1px);
}
.streaks i:nth-child(1) { left: -10vw; top: 62%; transform: rotate(-8deg); background: linear-gradient(90deg, transparent, var(--magenta), transparent); }
.streaks i:nth-child(2) { left: -6vw; top: 72%; transform: rotate(-3deg); background: linear-gradient(90deg, transparent, #8a5cff, transparent); }
.streaks i:nth-child(3) { right: -10vw; top: 60%; transform: rotate(8deg); background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
.streaks i:nth-child(4) { right: -6vw; top: 74%; transform: rotate(4deg); background: linear-gradient(90deg, transparent, var(--magenta), transparent); }

canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#ambient { z-index: 1; }
#burst { z-index: 40; }

.deco { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.deco > * { position: absolute; animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 -12px; } }
.qm {
  font-family: var(--f-display); line-height: 1;
  background: linear-gradient(160deg, #ffe066, #ff5ab4 45%, #6f7bff 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 rgba(40, 0, 80, .7)) drop-shadow(0 0 14px rgba(255, 90, 200, .55));
}
.qm.alt { background-image: linear-gradient(160deg, #ffb36b, #ff3f6c 55%, #ff9bd8); }
.qm.cool { background-image: linear-gradient(160deg, #8ef6ff, #3fa0ff 50%, #b05cff); }
.ball {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--f-display); font-size: 30px; color: #fff;
  border: 4px solid rgba(255,255,255,.85);
  box-shadow: inset 0 -8px 0 rgba(0,0,0,.22), inset 0 6px 0 rgba(255,255,255,.35), 0 0 22px rgba(255,255,255,.35);
  text-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.ball.a { background: radial-gradient(circle at 35% 30%, #a8ff8a, #22b04a 70%); }
.ball.b { background: radial-gradient(circle at 35% 30%, #ffd08a, #ff7a10 70%); }
.ball.c { background: radial-gradient(circle at 35% 30%, #e7b0ff, #8a2be2 70%); }
.ball.d { background: radial-gradient(circle at 35% 30%, #ff9aa6, #d8142f 70%); }
.bubble {
  font-family: var(--f-display); font-size: 26px; padding: 8px 16px;
  border-radius: 22px; color: #fff; border: 3px solid rgba(255,255,255,.85);
  box-shadow: 0 0 22px rgba(255,255,255,.3);
}
.bubble::after {
  content: ""; position: absolute; bottom: -12px; left: 18px;
  border: 8px solid transparent; border-top: 10px solid rgba(255,255,255,.85);
}
.bubble.hi { background: linear-gradient(160deg, #c08bff, #7a35ff); }
.bubble.yes { background: linear-gradient(160deg, #ffb25a, #ff7a10); }
.bubble.yes::after { left: auto; right: 18px; }
.star {
  width: 26px; height: 26px; background: #ffd23f;
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  filter: drop-shadow(0 0 8px #ffd23f);
  animation: twinkle 2.6s ease-in-out infinite;
}
@keyframes twinkle { 50% { opacity: .35; scale: .8; } }

/* ---------- Estrutura ---------- */
.app {
  position: relative; z-index: 5;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { width: 100%; max-width: 980px; display: flex; flex-direction: column; align-items: center; gap: 22px; margin-block: auto; }

/* Botão de som */
.sound {
  position: fixed; z-index: 30;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.5);
  background: rgba(13, 17, 69, .7); color: #fff; cursor: pointer;
  display: grid; place-items: center;
  backdrop-filter: blur(6px);
}
.sound svg { width: 22px; height: 22px; }
.sound:focus-visible, .btn:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 3px; }

/* ---------- Tela inicial ---------- */
.ring-wrap { position: relative; display: grid; place-items: center; padding: 24px 8px 6px; }
.halo {
  position: absolute; width: min(78vw, 520px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  border: 6px solid rgba(160, 90, 255, .8);
  box-shadow: 0 0 40px rgba(170, 90, 255, .8), inset 0 0 40px rgba(170, 90, 255, .6);
  background: radial-gradient(circle, rgba(60, 20, 140, .7), rgba(20, 10, 70, .2) 70%);
  z-index: -1;
}
.title {
  margin: 0;
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(88px, 22vw, 210px); line-height: .9; letter-spacing: .02em;
  background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 45%, var(--gold-3) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 2px rgba(255, 250, 220, .7);
  filter:
    drop-shadow(0 4px 0 #c45a0c)
    drop-shadow(0 6px 0 var(--gold-deep))
    drop-shadow(0 0 3px #ff4fd0)
    drop-shadow(0 0 22px rgba(255, 80, 200, .7));
  animation: pop-in .8s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes pop-in { from { scale: .4; opacity: 0; } }
.subtitle {
  margin: 0; text-align: center; text-wrap: balance;
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(26px, 6vw, 46px); line-height: 1.05; letter-spacing: .02em;
  text-transform: uppercase;
  color: #eaffff;
  text-shadow: 0 0 6px #6fe9ff, 0 0 18px #2fb8ff, 0 3px 0 #1c2b8a;
}
.lead { margin: 0; max-width: 40ch; text-align: center; color: var(--ink-soft); font-size: 18px; line-height: 1.45; text-wrap: balance; }

.picker { width: 100%; max-width: 720px; display: grid; gap: 12px; }
.picker-label { margin: 0; text-align: center; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chip {
  font: inherit; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 18px;
  background: rgba(13, 17, 69, .78);
  border: 2px solid rgba(140, 130, 255, .45);
  color: var(--ink);
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.chip:hover { transform: translateY(-2px); border-color: rgba(200, 180, 255, .9); }
.chip[aria-pressed="true"] {
  border-color: var(--gold-2);
  box-shadow: 0 0 0 3px rgba(255, 201, 40, .25), 0 0 24px rgba(255, 201, 40, .35);
}
.chip .dot { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; color: #fff; border: 2px solid rgba(255,255,255,.7); }
.chip .txt { min-width: 0; display: grid; }
.chip b { font-weight: 800; font-size: 17px; line-height: 1.2; }
.chip small { color: var(--ink-dim); font-size: 14px; line-height: 1.3; }
.dot.mix { background: radial-gradient(circle at 35% 30%, #ffe28a, #f08a00 70%); }
.dot.rs { background: radial-gradient(circle at 35% 30%, #a8fff0, #0e9f9a 70%); }
.dot.pv { background: radial-gradient(circle at 35% 30%, #e7b0ff, #6e22e6 70%); }
.dot.ig { background: radial-gradient(circle at 35% 30%, #ffb0ba, #cf0f2c 70%); }

.btn {
  font: inherit; cursor: pointer; border: 0;
  font-family: var(--f-display); font-size: 28px; letter-spacing: .04em; text-transform: uppercase;
  padding: 14px 44px 16px; border-radius: var(--radius-pill);
  color: #4a1c00;
  background: linear-gradient(180deg, #fff3a0, var(--gold-2) 50%, #ff9a1a);
  box-shadow: inset 0 -6px 0 rgba(150, 60, 0, .45), inset 0 4px 0 rgba(255,255,255,.6), 0 0 0 4px rgba(255, 240, 180, .6), 0 0 30px rgba(255, 190, 40, .6);
  transition: transform .12s;
}
.btn:hover { transform: translateY(-2px) scale(1.02); }
.btn:active { transform: translateY(2px); }
.btn.ghost {
  color: var(--ink); font-size: 20px; padding: 10px 26px 12px;
  background: rgba(13, 17, 69, .8);
  box-shadow: 0 0 0 3px rgba(140, 130, 255, .6), 0 0 18px rgba(140, 130, 255, .4);
}
.record { margin: 0; color: var(--ink-dim); font-size: 15px; font-weight: 700; }
.record strong { color: var(--gold-2); font-variant-numeric: tabular-nums; }
.keys-hint { margin: 0; color: var(--ink-dim); font-size: 14px; text-align: center; }
kbd { font-family: var(--f-body); font-weight: 800; font-size: 12px; padding: 1px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); }

/* ---------- HUD ---------- */
.hud { width: 100%; display: grid; grid-template-columns: 1.25fr 1fr auto 1.2fr; gap: 14px; align-items: center; }
.pill {
  min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 8px 16px; min-height: 68px;
  border-radius: 20px;
  background: linear-gradient(180deg, #1a1d6b, #0d1145);
  border: 3px solid #8f7bff;
  box-shadow: 0 0 0 2px rgba(20, 10, 70, .9), 0 0 18px rgba(143, 123, 255, .65), inset 0 0 14px rgba(143, 123, 255, .35);
  text-align: center;
}
.pill .k { display: block; font-family: var(--f-display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: #fff; line-height: 1; }
.pill .v { display: block; font-family: var(--f-display); font-size: 26px; color: var(--gold-2); line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 201, 40, .5); }
.brand .k { font-size: 19px; }
.flag { flex: none; width: 34px; height: 22px; border-radius: 4px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); overflow: hidden; display: block; }
.trophy { flex: none; width: 34px; height: 34px; }

.watch { position: relative; width: 84px; height: 92px; display: grid; place-items: end center; }
.watch svg { width: 84px; height: 92px; overflow: visible; }
.watch .time {
  position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
  font-family: var(--f-display); font-size: 17px; color: #fff; font-variant-numeric: tabular-nums;
}
.watch.hurry { animation: hurry .5s ease-in-out infinite alternate; }
.watch.hurry .time { color: #ffd0d6; }
@keyframes hurry { to { scale: 1.08; } }

/* ---------- Painel da pergunta ---------- */
.board {
  position: relative; width: 100%;
  padding: 30px clamp(18px, 4vw, 44px) 30px;
  border-radius: 28px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(80, 60, 200, .35), transparent 60%),
    var(--panel);
  border: 3px solid var(--panel-edge);
  box-shadow:
    0 0 0 6px rgba(13, 17, 69, .9),
    0 0 0 9px rgba(160, 90, 255, .85),
    0 0 36px rgba(160, 90, 255, .7),
    inset 0 0 30px rgba(63, 216, 255, .25);
  display: grid; gap: 24px;
}
.board.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { translate: -10px 0; } 40%, 80% { translate: 10px 0; } }
.board-head { display: grid; gap: 12px; justify-items: center; text-align: center; }
.tag {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 14px; border-radius: var(--radius-pill);
  font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  border: 2px solid currentColor;
}
.tag.rs { color: var(--t1); }
.tag.pv { color: var(--p1); }
.tag.ig { color: var(--r1); }
.prompt {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(22px, 3.4vw, 34px); letter-spacing: .03em; text-transform: uppercase; line-height: 1.1;
  text-wrap: balance;
}
.prompt em { font-style: normal; color: var(--gold-2); }
.context {
  margin: 0; max-width: 46ch;
  padding: 8px 16px; border-radius: 14px;
  background: rgba(63, 216, 255, .08); border: 1.5px dashed rgba(63, 216, 255, .5);
  color: #bdf3ff; font-weight: 600; font-size: clamp(17px, 2.3vw, 21px); line-height: 1.35;
}
.sentence {
  margin: 0; font-weight: 800; font-size: clamp(24px, 3.8vw, 38px); line-height: 1.3;
  text-wrap: balance; max-width: 30ch;
}
.sentence .hl { color: var(--gold-2); }
.blank {
  display: inline-block; min-width: 4.2em; padding: 0 .2em;
  border-bottom: 4px solid #fff; line-height: 1.1; text-align: center;
  transition: color .2s, border-color .2s;
}
.blank.filled.ok { color: var(--good); border-color: var(--good); text-shadow: 0 0 14px rgba(62, 224, 127, .6); }
.blank.filled.no { color: var(--gold-2); border-color: var(--gold-2); }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
.opt {
  --c1: var(--o1); --c2: var(--o2); --c3: var(--o3);
  position: relative; min-width: 0;
  font: inherit; cursor: pointer; color: #fff; text-align: left;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px 16px; min-height: 72px;
  border-radius: var(--radius-pill);
  border: 3px solid var(--c3);
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow:
    inset 0 5px 0 rgba(255,255,255,.35),
    inset 0 -7px 0 rgba(0,0,0,.22),
    0 0 0 3px rgba(10, 8, 50, .8),
    0 0 22px color-mix(in srgb, var(--c1) 70%, transparent);
  font-weight: 800; font-size: clamp(20px, 2.8vw, 30px); line-height: 1.15;
  text-shadow: 0 2px 0 rgba(0,0,0,.25);
  transition: transform .12s, filter .2s, opacity .2s;
}
.opt:nth-child(2) { --c1: var(--t1); --c2: var(--t2); --c3: var(--t3); }
.opt:nth-child(3) { --c1: var(--p1); --c2: var(--p2); --c3: var(--p3); }
.opt:nth-child(4) { --c1: var(--r1); --c2: var(--r2); --c3: var(--r3); }
.opt:hover:not(:disabled) { transform: translateY(-3px) scale(1.015); }
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt .letter { flex: none; font-family: var(--f-display); font-weight: 400; opacity: .95; }
.opt .label { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opts.done .opt:not(.right):not(.picked) { opacity: .35; filter: saturate(.4); }
.opt.right { box-shadow: inset 0 5px 0 rgba(255,255,255,.35), inset 0 -7px 0 rgba(0,0,0,.22), 0 0 0 4px var(--good), 0 0 30px var(--good); animation: glow 1s ease-in-out infinite alternate; }
.opt.picked.wrong { box-shadow: inset 0 5px 0 rgba(255,255,255,.2), 0 0 0 4px #fff, 0 0 0 7px var(--bad); filter: saturate(.6) brightness(.85); }
.opt .mark { position: absolute; right: 18px; font-size: 26px; }
@keyframes glow { to { filter: brightness(1.15); } }

.feedback {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 14px 18px; border-radius: 20px;
  background: rgba(10, 12, 50, .85);
  border: 2px solid rgba(255,255,255,.25);
  animation: rise .3s ease-out both;
}
.feedback.ok { border-color: var(--good); box-shadow: 0 0 20px rgba(62, 224, 127, .35); }
.feedback.no { border-color: var(--bad); box-shadow: 0 0 20px rgba(255, 75, 92, .35); }
@keyframes rise { from { opacity: 0; translate: 0 10px; } }
.fb-badge { font-family: var(--f-display); font-size: 26px; line-height: 1; white-space: nowrap; }
.feedback.ok .fb-badge { color: var(--good); }
.feedback.no .fb-badge { color: var(--bad); }
.fb-text { min-width: 0; display: grid; gap: 2px; }
.fb-text strong { font-size: 17px; }
.fb-text span { color: var(--ink-soft); font-size: 16px; line-height: 1.4; }
.fb-text .rule { color: #fff; font-weight: 700; }
.next { font-size: 20px; padding: 10px 24px 12px; white-space: nowrap; }

.float-pts {
  position: fixed; z-index: 45; pointer-events: none;
  font-family: var(--f-display); font-size: 44px; color: var(--gold-2);
  text-shadow: 0 3px 0 var(--gold-deep), 0 0 18px rgba(255, 201, 40, .8);
  animation: floatup 1.1s ease-out forwards;
}
@keyframes floatup { from { opacity: 0; translate: -50% 10px; scale: .6; } 20% { opacity: 1; scale: 1.15; } to { opacity: 0; translate: -50% -90px; scale: 1; } }
.streak-flag {
  font-family: var(--f-display); font-size: 18px; letter-spacing: .04em;
  color: #ffe9a0; text-shadow: 0 0 10px rgba(255, 140, 40, .9);
}

/* ---------- Resultado ---------- */
.result-card { width: 100%; max-width: 760px; }
.stars { display: flex; gap: 10px; justify-content: center; }
.stars i {
  width: 64px; height: 64px; background: rgba(255,255,255,.14);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.stars i.on { background: linear-gradient(180deg, #fff3a0, var(--gold-2) 50%, var(--gold-3)); filter: drop-shadow(0 0 10px var(--gold-2)); animation: pop-in .6s cubic-bezier(.2,1.6,.4,1) both; }
.stars i.on:nth-child(2) { animation-delay: .15s; width: 82px; height: 82px; }
.stars i:nth-child(2) { width: 82px; height: 82px; margin-top: -10px; }
.stars i.on:nth-child(3) { animation-delay: .3s; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Celular ---------- */
@media (max-width: 760px) {

<script>
/* ======================= BANCO DE PERGUNTAS ======================= */
// t: tema | p: enunciado | c: frase original (contexto) | q: frase com ___ | o: opções (a 1ª é a certa) | tip: explicação
const BANK = [
  // ---------- DISCURSO DIRETO E INDIRETO ----------
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'She said, “I am tired.”', q:'She said that she ___ tired.', o:['was','were','be','been'], tip:'<span class="rule">am/is → was.</span> No discurso indireto o verbo “volta” um tempo (backshift).' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'Tom said, “I work in a bank.”', q:'Tom said that he ___ in a bank.', o:['worked','working','work','have worked'], tip:'<span class="rule">Present simple → past simple.</span> work → worked.' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'They said, “We are watching TV.”', q:'They said that they ___ TV.', o:['were watching','was watching','watching','have watch'], tip:'<span class="rule">Present continuous → past continuous.</span> are watching → were watching.' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'He said, “I will call you.”', q:'He said that he ___ call me.', o:['would','was','had','is'], tip:'<span class="rule">will → would.</span>' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'Maria said, “I can swim.”', q:'Maria said that she ___ swim.', o:['could','cans','was','must to'], tip:'<span class="rule">can → could.</span>' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'He said, “I saw the movie.”', q:'He said that he ___ the movie.', o:['had seen','has saw','had saw','have seen'], tip:'<span class="rule">Past simple → past perfect</span> (had + particípio). saw → had seen.' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'She said, “I have finished my homework.”', q:'She said that she ___ her homework.', o:['had finished','has finish','had finish','have finished'], tip:'<span class="rule">Present perfect → past perfect.</span> have finished → had finished.' },
  { t:'rs', p:'Passe a <em>ordem</em> pro discurso indireto:', c:'“Close the door,” the teacher told us.', q:'The teacher told us ___ the door.', o:['to close','closing','close','closed'], tip:'<span class="rule">Ordem: told + pessoa + to + verbo.</span>' },
  { t:'rs', p:'Passe a <em>ordem</em> pro discurso indireto:', c:'“Don’t touch it,” Mom said to me.', q:'Mom told me ___ it.', o:['not to touch','don’t touch','to not touching','no touch'], tip:'<span class="rule">Ordem negativa: told + pessoa + not to + verbo.</span>' },
  { t:'rs', p:'Passe a <em>pergunta</em> pro discurso indireto:', c:'He asked, “Where do you live?”', q:'He asked me where I ___.', o:['lived','did live','do live','lives'], tip:'<span class="rule">Pergunta indireta não usa do/did</span> e fica na ordem de frase afirmativa: where I lived.' },
  { t:'rs', p:'Passe a <em>pergunta</em> pro discurso indireto:', c:'She asked, “Are you hungry?”', q:'She asked me ___ I was hungry.', o:['if','that','what','do'], tip:'<span class="rule">Pergunta de sim/não → if</span> (ou whether).' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'He said, “I am leaving tomorrow.”', q:'He said that he was leaving ___.', o:['the next day','tomorrow day','yesterday','the last day'], tip:'<span class="rule">tomorrow → the next day</span> (ou the following day).' },
  { t:'rs', p:'Passe pro <em>discurso indireto</em>:', c:'They said, “We live here.”', q:'They said that they lived ___.', o:['there','them','those','it'], tip:'<span class="rule">here → there.</span> Lugar e tempo também mudam.' },
  { t:'rs', p:'Qual frase está em <em>discurso direto</em>?', q:'', o:['Ana said, “I love pizza.”','Ana said that she loved pizza.','Ana told me she loved pizza.','Ana said she had loved pizza.'], tip:'<span class="rule">Discurso direto repete as palavras exatas, entre aspas.</span>' },
  { t:'rs', p:'Qual <em>discurso direto</em> está pontuado certo?', q:'', o:['He said, “I’m ready.”','He said “I’m ready”.','He said, I’m ready.','He said that, “I’m ready.”'], tip:'<span class="rule">Vírgula antes das aspas</span> e ponto final dentro delas. Sem “that” no discurso direto.' },

  // ---------- VOZ PASSIVA ----------
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The cake ___ by my grandmother yesterday.', o:['was made','made','is make','was make'], tip:'<span class="rule">Passiva = be + particípio.</span> Passado: was/were + made.' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'English ___ all over the world.', o:['is spoken','speaks','is speaking','spoken'], tip:'<span class="rule">Presente: is/are + particípio.</span> speak → spoken.' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The letters ___ every morning.', o:['are delivered','delivers','are deliver','delivered are'], tip:'<span class="rule">Sujeito no plural → are + particípio.</span>' },
  { t:'pv', p:'Passe pra <em>voz passiva</em>:', c:'Shakespeare wrote Hamlet.', q:'Hamlet ___ by Shakespeare.', o:['was written','wrote','was wrote','is writing'], tip:'<span class="rule">wrote → was written.</span> Use o particípio (written), não o passado (wrote).' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The new bridge ___ next year.', o:['will be built','will build','is built','will be build'], tip:'<span class="rule">Futuro: will be + particípio.</span>' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'My car ___ right now.', o:['is being repaired','is repairing','repairs','is repaired being'], tip:'<span class="rule">Passiva contínua: is/are + being + particípio.</span>' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'Look! All the tickets ___.', o:['have been sold','have sold','are selling','has been sold'], tip:'<span class="rule">Present perfect: have/has been + particípio.</span> tickets é plural → have.' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The thief ___ by the police last night.', o:['was caught','caught','was catched','is caught'], tip:'<span class="rule">catch é irregular:</span> catch – caught – caught.' },
  { t:'pv', p:'Passe pra <em>voz passiva</em>:', c:'They clean the office every day.', q:'The office ___ every day.', o:['is cleaned','cleans','is cleaning','was clean'], tip:'<span class="rule">Ativa no presente → is + particípio.</span>' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The homework must ___ before Friday.', o:['be done','done','be do','being done'], tip:'<span class="rule">Modal + be + particípio:</span> must be done.' },
  { t:'pv', p:'Qual frase está na <em>voz passiva</em>?', q:'', o:['The song was sung by Ana.','Ana sang the song.','Ana is singing the song.','Ana sings songs.'], tip:'<span class="rule">Na passiva o foco é na ação</span>, e quem fez aparece depois do “by”.' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'These photos ___ in 1990.', o:['were taken','was taken','were took','took'], tip:'<span class="rule">Plural no passado → were + particípio.</span> take – took – taken.' },
  { t:'pv', p:'Complete a <em>pergunta</em> na voz passiva:', q:'___ the email sent yesterday?', o:['Was','Did','Were','Has'], tip:'<span class="rule">Pergunta na passiva inverte o be:</span> Was the email sent?' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'Rice ___ in many Asian countries.', o:['is grown','grows up','is growing','grown'], tip:'<span class="rule">Fato geral → presente passivo.</span> grow – grew – grown.' },
  { t:'pv', p:'Complete com a <em>voz passiva</em>:', q:'The game ___ yesterday because of the rain.', o:['was cancelled','cancelled','is cancel','were cancelled'], tip:'<span class="rule">The game é singular → was + particípio.</span>' },

  // ---------- INFINITIVO E GERÚNDIO ----------
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'I enjoy ___ video games.', o:['playing','to play','play','played'], tip:'<span class="rule">enjoy + -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'She decided ___ medicine.', o:['to study','studying','study','studied'], tip:'<span class="rule">decide + to + verbo.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'We want ___ to the concert.', o:['to go','going','go','gone'], tip:'<span class="rule">want + to + verbo.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'___ is good for your health.', o:['Swimming','To swimming','Swim','Swims'], tip:'<span class="rule">Verbo como sujeito da frase → -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'He is good at ___ songs.', o:['writing','to write','write','wrote'], tip:'<span class="rule">Depois de preposição (at, in, of, about) → -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'I’m looking forward to ___ you.', o:['seeing','see','to see','saw'], tip:'<span class="rule">look forward to + -ing.</span> Aqui o “to” é preposição.' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'They promised ___ on time.', o:['to arrive','arriving','arrive','arrived'], tip:'<span class="rule">promise + to + verbo.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'Would you mind ___ the window?', o:['opening','to open','open','opened'], tip:'<span class="rule">mind + -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'I stopped ___ coffee because it kept me awake.', o:['drinking','to drink','drink','drank'], tip:'<span class="rule">stop + -ing = parar de fazer.</span> stop + to = parar pra fazer outra coisa.' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'Remember ___ the lights before you leave!', o:['to turn off','turning off','turn off','turned off'], tip:'<span class="rule">remember + to = lembrar de fazer (ainda vai fazer).</span> remember + -ing = lembrar de algo que já fez.' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'She avoids ___ in the rain.', o:['driving','to drive','drive','drove'], tip:'<span class="rule">avoid + -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'It’s too cold ___ outside.', o:['to play','playing','play','played'], tip:'<span class="rule">too + adjetivo + to + verbo.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'He keeps ___ the same mistake.', o:['making','to make','make','made'], tip:'<span class="rule">keep + -ing</span> = continuar fazendo.' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'I went to the store ___ some bread.', o:['to buy','buying','for buy','buy'], tip:'<span class="rule">Pra dizer o objetivo → to + verbo.</span> Nunca “for buy”.' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'She finished ___ the report at 6 p.m.', o:['writing','to write','write','wrote'], tip:'<span class="rule">finish + -ing.</span>' },
  { t:'ig', p:'Infinitivo ou <em>gerúndio</em>?', q:'They hope ___ the championship.', o:['to win','winning','win','won'], tip:'<span class="rule">hope + to + verbo.</span>' },
];

const TOPICS = {
  rs: { name: 'Discurso direto e indireto', en: 'Reported speech' },
  pv: { name: 'Voz passiva', en: 'Passive voice' },
  ig: { name: 'Infinitivo e gerúndio', en: 'Infinitive & gerund' },
};
const MODES = [
  { id: 'mix', dot: 'mix', icon: '★', name: 'Tudo misturado', sub: 'Os 3 temas na mesma rodada' },
  { id: 'rs',  dot: 'rs',  icon: '“',  name: 'Discurso direto e indireto', sub: 'Reported speech' },
  { id: 'pv',  dot: 'pv',  icon: 'P',  name: 'Voz passiva', sub: 'Passive voice' },
  { id: 'ig',  dot: 'ig',  icon: '-ing', name: 'Infinitivo e gerúndio', sub: 'to + verb ou verb + -ing' },
];
const ROUND = 10;
const TIME = 20; // segundos por pergunta
const LETTERS = ['A', 'B', 'C', 'D'];

/* ======================= ESTADO ======================= */
let S = freshState('mix');
let timerRAF = 0, deadline = 0, lastTick = -1;
let soundOn = true, actx = null;

function freshState(mode) {
  return { screen: 'start', mode, queue: [], i: 0, score: 0, streak: 0, bestStreak: 0, log: [], locked: false };
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $app = document.getElementById('app');
const $live = document.getElementById('live');

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(n) { return n.toLocaleString('pt-BR'); }

function buildRound(mode) {
  let picks;
  if (mode === 'mix') {
    const counts = shuffle([4, 3, 3]);
    picks = ['rs', 'pv', 'ig'].flatMap((t, k) => shuffle(BANK.filter(q => q.t === t)).slice(0, counts[k]));
    picks = shuffle(picks);
  } else {
    picks = shuffle(BANK.filter(q => q.t === mode)).slice(0, ROUND);
  }
  return picks.map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { ...q, opts: order.map(k => q.o[k]), answer: order.indexOf(0) };
  });
}

/* ======================= SOM ======================= */
function audio() {
  if (!soundOn) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, start, dur, type = 'sine', vol = .18) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  good() { tone(660, 0, .14, 'triangle'); tone(880, .1, .14, 'triangle'); tone(1320, .2, .28, 'triangle'); },
  bad() { tone(220, 0, .22, 'sawtooth', .1); tone(160, .16, .32, 'sawtooth', .1); },
  tick() { tone(1200, 0, .05, 'square', .05); },
  start() { [523, 659, 784, 1046].forEach((f, k) => tone(f, k * .09, .18, 'triangle', .14)); },
  end() { [784, 988, 1175, 1568].forEach((f, k) => tone(f, k * .12, .3, 'triangle', .14)); },
};
const $sound = document.getElementById('soundBtn');
soundOn = store.get('quizIngles.sound') !== 'off';
function paintSound() {
  $sound.setAttribute('aria-pressed', String(soundOn));
  $sound.setAttribute('aria-label', soundOn ? 'Som ligado. Clique para desligar' : 'Som desligado. Clique para ligar');
  $sound.querySelector('.wave').hidden = !soundOn;
  $sound.querySelector('.mute').hidden = soundOn;
}
$sound.addEventListener('click', () => { soundOn = !soundOn; store.set('quizIngles.sound', soundOn ? 'on' : 'off'); paintSound(); if (soundOn) tone(880, 0, .1, 'triangle'); });
paintSound();

/* ======================= TELAS ======================= */
function render() {
  cancelAnimationFrame(timerRAF);
  if (S.screen === 'start') renderStart();
  else if (S.screen === 'play') renderQuestion();
  else renderResult();
}

function renderStart() {
  const best = Number(store.get('quizIngles.best') || 0);
  $app.innerHTML = `
    <section class="screen" aria-labelledby="ttl">
      <div class="ring-wrap">
        <div class="halo"></div>
        <h1 class="title" id="ttl">QUIZ!</h1>
      </div>
      <p class="subtitle">Teste seu inglês!</p>
      <p class="lead">${ROUND} perguntas, ${TIME} segundos cada. Quanto mais rápido você acerta, mais pontos. Acertou 3 seguidas? Ganha bônus de sequência.</p>
      <div class="picker" role="group" aria-labelledby="pick-l">
        <p class="picker-label" id="pick-l">Escolha o tema</p>
        <div class="chips">
          ${MODES.map(m => `
            <button class="chip" type="button" id="mode-${m.id}" data-mode="${m.id}" aria-pressed="${S.mode === m.id}">
              <span class="dot ${m.dot}" aria-hidden="true" style="${m.icon.length > 2 ? 'font-size:13px' : ''}">${m.icon}</span>
              <span class="txt"><b>${m.name}</b><small>${m.sub}</small></span>
            </button>`).join('')}
        </div>
      </div>
      <button class="btn" type="button" id="play">Jogar</button>
      ${best ? `<p class="record">Seu recorde: <strong>${fmt(best)}</strong> pontos</p>` : ''}
      <p class="keys-hint">No computador: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> pra responder, <kbd>Enter</kbd> pra próxima.</p>
    </section>`;
  $app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    S.mode = b.dataset.mode;
    $app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    tone(700, 0, .06, 'triangle', .1);
  }));
  document.getElementById('play').addEventListener('click', startGame);
}

function startGame() {
  const mode = S.mode;
  S = freshState(mode);
  S.queue = buildRound(mode);
  S.screen = 'play';
  sfx.start();
  render();
  window.scrollTo({ top: 0 });
}

function hud() {
  const flags = document.getElementById('flags').innerHTML.trim().split('</svg>').filter(Boolean).map(s => s + '</svg>');
  return `
    <div class="hud">
      <div class="pill brand">${flags[0]}<span class="k">Quiz de<br>Inglês</span>${flags[1]}</div>
      <div class="pill qcount"><span><span class="k">Pergunta</span><span class="v">${pad(S.i + 1)}/${pad(S.queue.length)}</span></span></div>
      <div class="watch" id="watch" role="timer" aria-label="Tempo restante">
        <svg viewBox="0 0 84 92" aria-hidden="true">
          <rect x="35" y="0" width="14" height="9" rx="3" fill="#cfd3ff"/>
          <rect x="39" y="7" width="6" height="6" fill="#9aa0e0"/>
          <rect x="66" y="12" width="9" height="7" rx="2" transform="rotate(40 70 15)" fill="#cfd3ff"/>
          <circle cx="42" cy="52" r="37" fill="#e9ebff"/>
          <circle cx="42" cy="52" r="32" fill="#141a5a"/>
          <circle cx="42" cy="52" r="27" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
          <circle id="ring" cx="42" cy="52" r="27" fill="none" stroke="#3fd8ff" stroke-width="6" stroke-linecap="round" transform="rotate(-90 42 52)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
        </svg>
        <span class="time" id="time">00:${pad(TIME)}</span>
      </div>
      <div class="pill points"><span><span class="k">Pontos</span><span class="v" id="pts">${fmt(S.score)}</span></span>
        <svg class="trophy" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 6h20v8a10 10 0 0 1-20 0z" fill="#ffc928"/><path d="M10 9H5a5 5 0 0 0 6 8M30 9h5a5 5 0 0 1-6 8" fill="none" stroke="#ffc928" stroke-width="3"/><rect x="17" y="23" width="6" height="6" fill="#e0a010"/><rect x="11" y="29" width="18" height="6" rx="2" fill="#ffc928"/><path d="M20 9l1.5 3 3.3.4-2.4 2.3.6 3.3L20 16.5 17 18l.6-3.3-2.4-2.3 3.3-.4z" fill="#fff6c2"/></svg>
      </div>
    </div>`;
}

function sentenceHTML(q, fill, ok) {
  if (!q.q) return '';
  const parts = esc(q.q).split('___');
  const blank = fill != null
    ? `<span class="blank filled ${ok ? 'ok' : 'no'}">${esc(fill)}</span>`
    : `<span class="blank" aria-label="lacuna">&nbsp;</span>`;
  return `<p class="sentence">${parts[0]}${blank}${parts[1] || ''}</p>`;
}

function renderQuestion() {
  const q = S.queue[S.i];
  S.locked = false;
  $app.innerHTML = `
    <section class="screen" aria-label="Pergunta ${S.i + 1} de ${S.queue.length}">
      ${hud()}
      <div class="board" id="board">
        <div class="board-head">
          <span class="tag ${q.t}">${TOPICS[q.t].en}</span>
          <h2 class="prompt">${q.p}</h2>
          ${q.c ? `<p class="context">${esc(q.c)}</p>` : ''}
          <div id="sent">${sentenceHTML(q)}</div>
          ${S.streak >= 2 ? `<span class="streak-flag">🔥 ${S.streak} seguidas</span>` : ''}
        </div>
        <div class="opts" id="opts">
          ${q.opts.map((o, k) => `<button class="opt" type="button" id="opt-${k}" data-k="${k}"><span class="letter">[${LETTERS[k]}]</span><span class="label">${esc(o)}</span></button>`).join('')}
        </div>
        <div id="fb"></div>
      </div>
    </section>`;
  $app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(Number(b.dataset.k))));
  $live.textContent = `Pergunta ${S.i + 1}. ${q.p.replace(/<[^>]+>/g, '')} ${q.c || ''} ${q.q.replace('___', 'lacuna')}`;
  startTimer();
}

function startTimer() {
  deadline = performance.now() + TIME * 1000;
  lastTick = -1;
  const ring = document.getElementById('ring'), time = document.getElementById('time'), watch = document.getElementById('watch');
  const loop = now => {
    const left = Math.max(0, (deadline - now) / 1000);
    const secs = Math.ceil(left);
    ring.setAttribute('stroke-dashoffset', String(100 - (left / TIME) * 100));
    time.textContent = '00:' + pad(secs);
    const hurry = left <= 5;
    ring.setAttribute('stroke', hurry ? '#ff4b5c' : left <= 10 ? '#ffc928' : '#3fd8ff');
    watch.classList.toggle('hurry', hurry && !reduceMotion);
    if (hurry && secs !== lastTick && secs > 0) { lastTick = secs; sfx.tick(); }
    if (left <= 0) { answer(-1); return; }
    timerRAF = requestAnimationFrame(loop);
  };
  timerRAF = requestAnimationFrame(loop);
}

function answer(k) {
  if (S.locked) return;
  S.locked = true;
  cancelAnimationFrame(timerRAF);
  document.getElementById('watch').classList.remove('hurry');
  const q = S.queue[S.i];
  const left = Math.max(0, (deadline - performance.now()) / 1000);
  const ok = k === q.answer;
  let gained = 0;
  if (ok) {
    S.streak++;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    const speed = Math.round(left * 5);            // até +100 por velocidade
    const bonus = S.streak >= 3 ? 50 : 0;           // bônus de sequência
    gained = 100 + speed + bonus;
    S.score += gained;
  } else {
    S.streak = 0;
  }
  S.log.push({ q, picked: k, ok, gained });

  const opts = document.getElementById('opts');
  opts.classList.add('done');
  opts.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', '<span class="mark" aria-hidden="true">✓</span>'); }
    if (idx === k) b.classList.add('picked');
    if (idx === k && !ok) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', '<span class="mark" aria-hidden="true">✗</span>'); }
  });
  document.getElementById('sent').innerHTML = sentenceHTML(q, q.opts[q.answer], ok);
  document.getElementById('pts').textContent = fmt(S.score);

  const last = S.i === S.queue.length - 1;
  const badge = ok ? (S.streak >= 3 ? 'COMBO!' : pick(['BOA!', 'ISSO!', 'MANDOU BEM!', 'PERFEITO!'])) : (k === -1 ? 'TEMPO!' : 'QUASE!');
  const head = ok
    ? `+${gained} pontos${S.streak >= 3 ? ' (bônus de sequência!)' : ''}`
    : `Resposta certa: ${esc(q.opts[q.answer])}`;
  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'no'}" role="status">
      <span class="fb-badge">${badge}</span>
      <span class="fb-text"><strong>${head}</strong><span>${q.tip}</span></span>
      <button class="btn next" type="button" id="next">${last ? 'Ver resultado' : 'Próxima →'}</button>
    </div>`;
  const next = document.getElementById('next');
  next.addEventListener('click', goNext);
  next.focus({ preventScroll: true });
  if (window.innerWidth < 760) document.getElementById('fb').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });

  if (ok) {
    sfx.good();
    const btn = opts.children[q.answer].getBoundingClientRect();
    floatPoints(`+${gained}`, btn.left + btn.width / 2, btn.top);
    confettiBurst(btn.left + btn.width / 2, btn.top + btn.height / 2, S.streak >= 3 ? 120 : 70);
  } else {
    sfx.bad();
    if (!reduceMotion) document.getElementById('board').classList.add('shake');
  }
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function goNext() {
  if (S.i < S.queue.length - 1) { S.i++; render(); }
  else { S.screen = 'result'; render(); }
  window.scrollTo({ top: 0 });
}

function floatPoints(text, x, y) {
  const el = document.createElement('div');
  el.className = 'float-pts'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = (y - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function renderResult() {
  const total = S.queue.length;
  const right = S.log.filter(l => l.ok).length;
  const stars = right >= 9 ? 3 : right >= 6 ? 2 : right >= 3 ? 1 : 0;
  const prevBest = Number(store.get('quizIngles.best') || 0);
  const isRecord = prevBest > 0 && S.score > prevBest;
  if (S.score > prevBest) store.set('quizIngles.best', String(S.score));
  const verdict = right === total ? 'Gabaritou! Nível nativo.' : stars === 3 ? 'Mandou muito bem!' : stars === 2 ? 'Bom jogo! Dá pra subir mais.' : stars === 1 ? 'Tá no caminho. Revisa as dicas e tenta de novo.' : 'Bora revisar e jogar de novo!';
  const topics = ['rs', 'pv', 'ig'].map(t => {
    const items = S.log.filter(l => l.q.t === t);
    return { t, n: items.length, ok: items.filter(l => l.ok).length };
  }).filter(x => x.n);
  const wrong = S.log.filter(l => !l.ok);

  $app.innerHTML = `
    <section class="screen result-card" aria-labelledby="res-t">
      <div class="board">
        <div class="board-head">
          <div class="stars" aria-label="${stars} de 3 estrelas">${[0, 1, 2].map(k => `<i class="${k < stars ? 'on' : ''}"></i>`).join('')}</div>
          <h2 class="prompt" id="res-t">Fim de jogo!</h2>
          <p class="big-score">${fmt(S.score)}</p>
          <p class="verdict">${isRecord ? 'Novo recorde! ' : ''}${verdict}</p>
        </div>
        <div class="stats">
          <div class="stat"><b>${right}/${total}</b><span>Acertos</span></div>
          <div class="stat"><b>${S.bestStreak}</b><span>Maior sequência</span></div>
          <div class="stat"><b>${fmt(Math.max(prevBest, S.score))}</b><span>Recorde</span></div>
        </div>
        <div class="bars">
          ${topics.map(x => `
            <div class="bar-row">
              <span class="name">${TOPICS[x.t].name}</span>
              <span class="track"><span class="fill ${x.t}" style="display:block;width:${(x.ok / x.n) * 100}%"></span></span>
              <span class="n">${x.ok}/${x.n}</span>
            </div>`).join('')}
        </div>
        <div class="review">
          <h3>Revisão</h3>
          ${wrong.length ? `<ol>${wrong.map(l => `
            <li>
              <span class="q">${l.q.c ? esc(l.q.c) + ' → ' : ''}${l.q.q ? esc(l.q.q) : l.q.p.replace(/<[^>]+>/g, '')}</span>
              <span class="a">Certo: <b>${esc(l.q.opts[l.q.answer])}</b>${l.picked >= 0 ? ` · você marcou <s>${esc(l.q.opts[l.picked])}</s>` : ' · o tempo acabou'}</span>
              <span class="tip">${l.q.tip}</span>
            </li>`).join('')}</ol>` : `<p class="all-right">Nenhum erro pra revisar. Perfeito!</p>`}
        </div>
        <div class="actions">
          <button class="btn" type="button" id="again">Jogar de novo</button>
          <button class="btn ghost" type="button" id="menu">Trocar tema</button>
        </div>
      </div>
    </section>`;
  document.getElementById('again').addEventListener('click', startGame);
  document.getElementById('menu').addEventListener('click', () => { S.screen = 'start'; render(); window.scrollTo({ top: 0 }); });
  sfx.end();
  if (stars >= 2) { confettiBurst(innerWidth * .3, innerHeight * .3, 110); setTimeout(() => confettiBurst(innerWidth * .7, innerHeight * .3, 110), 250); }
  $live.textContent = `Fim de jogo. ${S.score} pontos, ${right} de ${total} acertos.`;
}

/* ======================= TECLADO ======================= */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.screen !== 'play') return;
  const key = e.key.toUpperCase();
  if (!S.locked) {
    const idx = LETTERS.indexOf(key) >= 0 ? LETTERS.indexOf(key) : ['1', '2', '3', '4'].indexOf(key);
    if (idx >= 0) { e.preventDefault(); answer(idx); }
  } else if (key === 'ENTER' && document.activeElement?.id !== 'next') {
    e.preventDefault(); goNext();
  }
});

/* ======================= CONFETE ======================= */
const COLORS = ['#ffc928', '#ff3fb4', '#3fd8ff', '#3ee07f', '#b45cff', '#ff7a10', '#ffffff'];
function makeCanvas(id) {
  const c = document.getElementById(id), ctx = c.getContext('2d');
  const fit = () => { const d = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * d; c.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  fit(); addEventListener('resize', fit);
  return ctx;
}
const amb = makeCanvas('ambient'), fx = makeCanvas('burst');
const ambient = [], bursts = [];
function piece(x, y, vx, vy) {
  return { x, y, vx, vy, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 1 };
}
if (!reduceMotion) for (let i = 0; i < 46; i++) ambient.push(piece(Math.random() * innerWidth, Math.random() * innerHeight, (Math.random() - .5) * .4, .3 + Math.random() * .7));
function confettiBurst(x, y, n) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
    bursts.push(piece(x, y, Math.cos(a) * s, Math.sin(a) * s - 6));
  }
}
function drawPiece(ctx, p) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, p.life);
  ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1); ctx.restore();
}
function frame() {
  amb.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of ambient) {
    p.x += p.vx + Math.sin(p.y / 60) * .3; p.y += p.vy; p.r += p.vr * .3;
    if (p.y > innerHeight + 10) { p.y = -10; p.x = Math.random() * innerWidth; }
    p.life = .55; drawPiece(amb, p);
  }
  fx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = bursts.length - 1; i >= 0; i--) {
    const p = bursts[i];
    p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .008;
    if (p.life <= 0 || p.y > innerHeight + 20) { bursts.splice(i, 1); continue; }
    drawPiece(fx, p);
  }
  requestAnimationFrame(frame);
}
if (!reduceMotion) requestAnimationFrame(frame);

/* ======================= INÍCIO ======================= */
window.claude?.hot?.snapshot?.(() => ({ S }));
function start(data) {
  if (data && data.S && data.S.screen) S = data.S;
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
